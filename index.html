<html lang="de">
<head>
<meta charset="utf-8">

<title>Handelsmarketing Lernskript</title>

<body>
<!-- Interaktives Lernskript Handelsmarketing – Kap. 5, 6, 8.1 · In WordPress in einen Block "Individuelles HTML" einfügen. -->
<!-- Nur ein Kapitel zeigen: data-kapitel="k5", "k6", "k8", "fall" oder "quiz" setzen. Standard: "alle". -->
<div id="hm-lern" data-kapitel="alle">
<style>
#hm-lern{--o:#E07B24;--o2:#FDF1E6;--b:#1F5C8B;--b2:#E8F1F8;--g:#2E7D32;--g2:#E9F5EA;--r:#C62828;--r2:#FDECEA;--t:#2B2B2B;--m:#6b6b6b;--l:#e3e3e3;--bg:#ffffff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;color:var(--t);background:var(--bg);max-width:960px;margin:0 auto;padding:0;text-align:left}
#hm-lern *{box-sizing:border-box}
#hm-lern h2,#hm-lern h3,#hm-lern h4,#hm-lern p,#hm-lern ul,#hm-lern ol{margin:0 0 .6em 0;padding:0}
#hm-lern ul,#hm-lern ol{padding-left:1.3em}
#hm-lern li{margin:.15em 0}
#hm-lern h2{font-size:1.5em;color:var(--o);line-height:1.25}
#hm-lern h3{font-size:1.15em;color:var(--b);line-height:1.3}
#hm-lern h4{font-size:1em;color:var(--t)}
#hm-lern button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--l);background:#fff;color:var(--t);padding:.45em .9em;line-height:1.3;text-transform:none;letter-spacing:0;box-shadow:none;min-height:0;width:auto}
#hm-lern button:hover{border-color:var(--o)}
#hm-lern button:focus-visible{outline:3px solid var(--o);outline-offset:2px}
#hm-lern .hm-head{background:linear-gradient(135deg,#E07B24,#c45f0c);color:#fff;border-radius:14px;padding:22px 22px 16px;margin-bottom:14px}
#hm-lern .hm-head h2{color:#fff;margin-bottom:.2em}
#hm-lern .hm-head p{margin:0;opacity:.95}
#hm-lern .hm-progress{margin-top:12px;background:rgba(255,255,255,.3);border-radius:99px;height:9px;overflow:hidden}
#hm-lern .hm-progress span{display:block;height:100%;background:#fff;width:0;transition:width .4s}
#hm-lern .hm-plabel{font-size:.85em;margin-top:5px;opacity:.95}
#hm-lern .hm-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--l)}
#hm-lern .hm-tabs button{border-radius:99px;font-size:.92em}
#hm-lern .hm-tabs button[aria-selected="true"]{background:var(--o);color:#fff;border-color:var(--o)}
#hm-lern .hm-panel{display:none}
#hm-lern .hm-panel.on{display:block}
#hm-lern .hm-intro{background:var(--b2);border-left:4px solid var(--b);padding:12px 14px;border-radius:8px;margin-bottom:14px}
#hm-lern .hm-card{border:1px solid var(--l);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff}
#hm-lern .hm-card>button.hm-acc{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:0;background:#fafafa;padding:12px 14px;text-align:left;font-weight:600;font-size:1.02em}
#hm-lern .hm-card>button.hm-acc:hover{background:var(--o2)}
#hm-lern .hm-num{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--b);color:#fff;font-size:.85em}
#hm-lern .hm-card.done .hm-num{background:var(--g)}
#hm-lern .hm-acc .hm-tt{flex:1}
#hm-lern .hm-acc .hm-chev{transition:transform .2s;color:var(--m)}
#hm-lern .hm-card.open .hm-chev{transform:rotate(90deg)}
#hm-lern .hm-body{display:none;padding:14px 16px 16px;border-top:1px solid var(--l)}
#hm-lern .hm-card.open .hm-body{display:block}
#hm-lern .hm-fig{background:#fcfcfc;border:1px solid var(--l);border-radius:10px;padding:10px;margin:0 0 14px;text-align:center}
#hm-lern .hm-fig svg{width:100%;height:auto;max-width:620px;display:inline-block}
#hm-lern .hm-fig figcaption,#hm-lern .hm-cap{font-size:.8em;color:var(--m);margin-top:4px}
#hm-lern .hm-sec{margin:0 0 12px}
#hm-lern .hm-lab{display:inline-block;font-size:.75em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--b);margin-bottom:3px}
#hm-lern .hm-kl{background:var(--o2);border-left:4px solid var(--o);padding:10px 12px;border-radius:8px;margin:0 0 12px}
#hm-lern .hm-kl .hm-lab{color:#b25a12}
#hm-lern .hm-task{background:var(--g2);border:1px solid #cfe6d1;border-radius:10px;padding:12px;margin:0 0 10px}
#hm-lern .hm-task .hm-lab{color:var(--g)}
#hm-lern .hm-sol{display:none;margin-top:10px;background:#fff;border-radius:8px;padding:10px 12px;border:1px dashed #9cc9a0}
#hm-lern .hm-sol.on{display:block}
#hm-lern .hm-done{display:flex;align-items:center;gap:8px;font-size:.92em;color:var(--m);margin-top:6px;cursor:pointer}
#hm-lern .hm-done input{width:18px;height:18px;accent-color:var(--g);margin:0}
#hm-lern table.hm-t{width:100%;border-collapse:collapse;margin:0 0 12px;font-size:.92em}
#hm-lern table.hm-t th,#hm-lern table.hm-t td{border:1px solid var(--l);padding:6px 8px;vertical-align:top;text-align:left}
#hm-lern table.hm-t th{background:var(--b);color:#fff;font-weight:600}
#hm-lern table.hm-t tr:nth-child(even) td{background:#f7f7f7}
#hm-lern .hm-scroll{overflow-x:auto}
#hm-lern .hm-grid{display:grid;gap:8px;margin:0 0 4px}
#hm-lern .hm-tile{border-radius:10px;padding:10px;font-size:.88em;line-height:1.4;text-align:left}
#hm-lern .hm-tile b{display:block;font-size:1.05em;margin-bottom:2px}
#hm-lern .hm-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;justify-content:center}
#hm-lern .hm-step{position:relative;background:var(--b2);border:1px solid #bcd3e6;border-radius:10px;padding:8px 10px;font-size:.85em;flex:1 1 120px;max-width:200px;text-align:left}
#hm-lern .hm-step b{display:block;color:var(--b)}
#hm-lern .hm-step .n{display:inline-block;background:var(--o);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;font-size:.8em;margin-right:4px}
#hm-lern .hm-quiz{border:2px solid var(--o);border-radius:12px;padding:14px 16px;margin:18px 0}
#hm-lern .hm-q{margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--l)}
#hm-lern .hm-q:last-of-type{border-bottom:0}
#hm-lern .hm-q p.qq{font-weight:600;margin-bottom:6px}
#hm-lern .hm-opts{display:grid;gap:6px}
#hm-lern .hm-opts button{text-align:left;width:100%}
#hm-lern .hm-opts button.ok{background:var(--g2);border-color:var(--g);color:#1b5e20}
#hm-lern .hm-opts button.no{background:var(--r2);border-color:var(--r);color:#8e1c1c}
#hm-lern .hm-opts button[disabled]{cursor:default}
#hm-lern .hm-expl{display:none;font-size:.9em;margin-top:6px;padding:8px 10px;border-radius:8px;background:#f5f5f5}
#hm-lern .hm-expl.on{display:block}
#hm-lern .hm-score{font-weight:700;color:var(--b);margin:6px 0 10px}
#hm-lern .hm-btn{background:var(--o);color:#fff;border-color:var(--o)}
#hm-lern .hm-btn:hover{background:#c45f0c;color:#fff}
#hm-lern .hm-case{background:var(--b2);border:1px solid #bcd3e6;border-radius:12px;padding:14px 16px;margin:0 0 14px}
#hm-lern .hm-pts{display:inline-block;background:var(--b);color:#fff;border-radius:99px;font-size:.75em;padding:1px 8px;margin-left:6px;vertical-align:middle}
#hm-lern .hm-small{font-size:.85em;color:var(--m)}
#hm-lern svg text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (max-width:600px){#hm-lern{font-size:15px}#hm-lern .hm-head{padding:16px}#hm-lern .hm-body{padding:12px}#hm-lern .hm-grid{grid-template-columns:1fr 1fr !important}#hm-lern .hm-step{max-width:none;flex-basis:45%}}
</style>
<style>
#hm-lern .hm-deep{border:1px solid #d9cbb8;background:#fffaf3;border-radius:10px;margin:0 0 12px}
#hm-lern .hm-deep>summary{cursor:pointer;padding:10px 12px;font-weight:700;color:#8a4a10;list-style:none}
#hm-lern .hm-deep>summary::-webkit-details-marker{display:none}
#hm-lern .hm-deep>summary::before{content:"+ ";font-weight:700}
#hm-lern .hm-deep[open]>summary::before{content:"− "}
#hm-lern .hm-deep .in{padding:0 14px 12px}
#hm-lern .hm-deep p{margin-bottom:.6em}
#hm-lern .hm-merk{background:#fff;border:1px dashed #E07B24;border-radius:8px;padding:8px 10px;margin:6px 0 4px}
#hm-lern .hm-merk b{color:#b25a12}
#hm-lern .hm-ab{border-bottom:1.5px dotted #1F5C8B;cursor:help;text-decoration:none;color:inherit}
#hm-lern .hm-ab:focus-visible{outline:2px solid #E07B24;outline-offset:1px}
#hm-tip{position:fixed;z-index:10001;max-width:280px;background:#1F2F40;color:#fff;font-size:13px;line-height:1.4;padding:8px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#hm-tip b{color:#FFC48A}
#hm-lern .hm-games{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
#hm-lern .hm-gbtn{background:#1F5C8B;color:#fff;border-color:#1F5C8B;font-weight:600}
#hm-lern .hm-gbtn:hover{background:#174a72;color:#fff}
#hm-lern .hm-gbtn.won{background:#2E7D32;border-color:#2E7D32}
#hm-lern .hm-gbtn.won::after{content:" ✓"}
#hm-lern .hm-modal{position:fixed;inset:0;z-index:10000;background:rgba(20,28,38,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
#hm-lern .hm-modal[hidden]{display:none}
#hm-lern .hm-mbox{background:#fff;border-radius:16px;width:100%;max-width:820px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);position:relative;margin-top:10px}
#hm-lern .hm-mclose{position:absolute;top:10px;right:10px;border-radius:99px;width:38px;height:38px;padding:0;font-size:20px;line-height:1}
#hm-lern .hm-mbox h3{padding-right:44px}
#hm-lern .hm-mem{display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:8px;margin:10px 0}
#hm-lern .hm-mem button{min-height:92px;border-radius:10px;padding:8px;font-size:.86em;line-height:1.3;border:2px solid #1F5C8B;background:repeating-linear-gradient(45deg,#1F5C8B,#1F5C8B 8px,#24689c 8px,#24689c 16px);color:transparent;transition:transform .2s,background .2s;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word;hyphens:auto}
#hm-lern .hm-mem button.up{background:#fff;color:#2B2B2B}
#hm-lern .hm-mem button.up.a{border-color:#E07B24;background:#FDF1E6;font-weight:700}
#hm-lern .hm-mem button.up.b{border-color:#1F5C8B;background:#E8F1F8}
#hm-lern .hm-mem button.match{border-color:#2E7D32 !important;background:#E9F5EA !important;color:#1b5e20;cursor:default}
#hm-lern .hm-mem button.bad{border-color:#C62828 !important;animation:hmShake .35s}
@keyframes hmShake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#hm-lern .hm-gstat{display:flex;gap:14px;flex-wrap:wrap;font-size:.9em;color:#555;margin:4px 0}
#hm-lern .hm-win{background:#E9F5EA;border:1px solid #2E7D32;color:#1b5e20;border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:600}
#hm-lern .hm-ord-pool,#hm-lern .hm-ord-done{display:grid;gap:6px;margin:8px 0}
#hm-lern .hm-ord-pool button{text-align:left}
#hm-lern .hm-ord-pool button.bad{border-color:#C62828;background:#FDECEA;animation:hmShake .35s}
#hm-lern .hm-ord-done div{background:#E9F5EA;border:1px solid #9cc9a0;border-radius:8px;padding:6px 10px;font-size:.92em}
#hm-lern .hm-ord-done div span{display:inline-block;background:#2E7D32;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;font-size:.8em;margin-right:6px}
#hm-lern .hm-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:9000;background:#E07B24;color:#fff;border:0;border-radius:99px;padding:12px 18px;font-weight:700;box-shadow:0 8px 24px rgba(224,123,36,.45)}
#hm-lern .hm-fab:hover{background:#c45f0c;color:#fff}
#hm-lern .hm-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
#hm-lern .hm-chips button{border-radius:99px;font-size:.85em;padding:.35em .8em}
#hm-lern .hm-chips button.on{background:#1F5C8B;color:#fff;border-color:#1F5C8B}
#hm-lern .hm-fc{perspective:1200px;margin:8px 0}
#hm-lern .hm-fcin{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
#hm-lern .hm-fc.flip .hm-fcin{transform:rotateY(180deg)}
#hm-lern .hm-fside{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
#hm-lern .hm-front{background:#FDF1E6;border:2px solid #E07B24}
#hm-lern .hm-back{background:#E8F1F8;border:2px solid #1F5C8B;transform:rotateY(180deg);font-size:.95em;text-align:left;align-items:flex-start}
#hm-lern .hm-front .q{font-size:1.25em;font-weight:700;color:#2B2B2B}
#hm-lern .hm-fside .meta{font-size:.75em;color:#777;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
#hm-lern .hm-fcbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
#hm-lern .hm-fcbtns .no{background:#FDECEA;border-color:#C62828;color:#8e1c1c;font-weight:700}
#hm-lern .hm-fcbtns .ok{background:#E9F5EA;border-color:#2E7D32;color:#1b5e20;font-weight:700}
#hm-lern .hm-boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
#hm-lern .hm-boxes div{border:1px solid #ddd;border-radius:8px;padding:6px;text-align:center;font-size:.8em;background:#fafafa}
#hm-lern .hm-boxes div b{display:block;font-size:1.5em;color:#1F5C8B;font-variant-numeric:tabular-nums}
#hm-lern .hm-boxes div.cur{border-color:#E07B24;background:#FDF1E6}
#hm-lern .hm-dash{display:grid;gap:10px;margin:0 0 16px}
#hm-lern .hm-dcard{border:1px solid #e3e3e3;border-radius:12px;padding:12px 14px;background:#fff}
#hm-lern .hm-dcard h4{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
#hm-lern .hm-dcard h4 span{color:#E07B24;font-variant-numeric:tabular-nums}
#hm-lern .hm-bar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin:4px 0 8px}
#hm-lern .hm-bar i{display:block;height:100%;background:linear-gradient(90deg,#E07B24,#2E7D32);border-radius:99px;transition:width .4s}
#hm-lern .hm-parts{display:flex;flex-wrap:wrap;gap:6px;font-size:.8em}
#hm-lern .hm-parts span{background:#f3f3f3;border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}
#hm-lern .hm-parts span.full{background:#E9F5EA;color:#1b5e20}
#hm-lern .hm-big{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#E8F1F8;border-radius:12px;padding:14px 16px;margin:0 0 12px}
#hm-lern .hm-big .pct{font-size:2.4em;font-weight:800;color:#1F5C8B;font-variant-numeric:tabular-nums;line-height:1}
#hm-lern .hm-big .lvl{font-weight:700}
#hm-lern .hm-chbar{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:.88em;color:#555}
#hm-lern .hm-chbar .hm-bar{flex:1;margin:0}
#hm-lern .hm-gl{display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:0;border:1px solid #e3e3e3;border-radius:10px;overflow:hidden;margin-bottom:14px}
#hm-lern .hm-gl dt,#hm-lern .hm-gl dd{margin:0;padding:7px 10px;border-bottom:1px solid #eee}
#hm-lern .hm-gl dt{font-weight:700;color:#1F5C8B;background:#f7f9fb}
#hm-lern .hm-search{width:100%;padding:.55em .8em;border:1px solid #ccc;border-radius:8px;font:inherit;margin:0 0 10px}
#hm-lern .hm-tabs button .pc{font-size:.78em;opacity:.8;margin-left:4px;font-variant-numeric:tabular-nums}
@media (max-width:600px){#hm-lern .hm-mem{grid-template-columns:repeat(var(--cm,3),1fr)}#hm-lern .hm-mem button{min-height:84px;font-size:.78em}#hm-lern .hm-fab{padding:10px 14px}#hm-lern .hm-gl{grid-template-columns:1fr}#hm-lern .hm-gl dt{border-bottom:0}}
@media (prefers-reduced-motion:reduce){#hm-lern .hm-fcin,#hm-lern .hm-mem button{transition:none}#hm-lern .hm-mem button.bad,#hm-lern .hm-ord-pool button.bad{animation:none}}
</style>
<div class="hm-head">
<h2>Handelsmarketing – interaktives Lernskript</h2>
<p>Kapitel 5 Situationsanalyse · Kapitel 6 Strategien · Kapitel 8.1 Produkt- und Sortimentspolitik</p>
<div class="hm-progress" aria-hidden="true"><span id="hm-pbar"></span></div>
<div class="hm-plabel" id="hm-plabel">Lernfortschritt wird geladen …</div>

<div class="hm-tabs" role="tablist" id="hm-tabs"></div>

<script>
(function(){
var root=document.getElementById("hm-lern");
if(!root||root.getAttribute("data-init"))return;root.setAttribute("data-init","1");
/* ---------- Farben & SVG-Helfer ---------- */
var C={o:"#E07B24",o2:"#FDF1E6",b:"#1F5C8B",b2:"#E8F1F8",g:"#2E7D32",g2:"#E9F5EA",r:"#C62828",r2:"#FDECEA",y:"#F9A825",y2:"#FFF8E1",p:"#6A1B9A",p2:"#F3E5F5",t:"#2B2B2B",m:"#777",l:"#ccc"};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function txt(x,y,s,o){o=o||{};var lines=String(s).split("\n"),fs=o.fs||13,lh=o.lh||fs*1.25,out="",y0=y-(lines.length-1)*lh/2;
for(var i=0;i<lines.length;i++){out+='<text x="'+x+'" y="'+(y0+i*lh)+'" text-anchor="'+(o.a||"middle")+'" dominant-baseline="middle" font-size="'+fs+'" font-weight="'+(o.w||400)+'" fill="'+(o.c||C.t)+'"'+(o.rot?' transform="rotate('+o.rot+' '+x+' '+y+')"':'')+'>'+esc(lines[i])+'</text>';}return out;}
var svgN=0;function svg(w,h,inner,label){var mid="hmA"+(++svgN);inner=inner.split("url(#hmA)").join("url(#"+mid+")");return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label||"Grafik")+'" xmlns="http://www.w3.org/2000/svg"><defs><marker id="'+mid+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#555"/></marker></defs>'+inner+'</svg>';}
function fig(inner,cap){return '<figure class="hm-fig">'+inner+(cap?'<figcaption>'+cap+'</figcaption>':'')+'</figure>';}
/* 2x2-Matrix: o={xt,yt,xl:[l,r],yl:[oben,unten],cells:[[tl,tr],[bl,br]] mit {t,s,bg,c}, arrow} */
function matrix(o){var W=570,H=(o.arrow?375:330),x0=135,y0=50,cw=215,ch=135,s="";
s+=txt(x0+cw,18,o.xt,{fs:14,w:700,c:C.b});

var CH=[
{id:"k5",tab:"Kap. 5 · Analyse",title:"Kapitel 5 – Strategische Situationsanalyse",intro:"Der Handlungsspielraum eines Unternehmens wird durch seine Situation begrenzt oder erweitert. Veränderungen gelten als <b>Chance oder Risiko</b>. Kluges Marketing untersucht <b>externe und interne</b> Faktoren und behält ihre Veränderung im Blick: Positive Faktoren werden <b>ausgenutzt</b>, negativen wird <b>ausgewichen</b>.",
models:[
{t:"Der Prozess einer strategischen Fallaufgabe",g:G.fall,what:"Jede strategische Entscheidung folgt derselben Logik. Wer sie kennt, kann jede Fallaufgabe strukturieren – auch wenn ein Modell gerade nicht einfällt.",steps:["<b>Analyse extern:</b> Was passiert im Umfeld? (PESTEL, Five Forces, Wettbewerbsanalyse)","<b>Analyse intern:</b> Was können wir, was fehlt uns? (Ressourcen, Lebenszyklus, BCG)","<b>Zusammenführen:</b> SWOT und SWOT-Matrix, ggf. GAP-Analyse","<b>Strategie wählen:</b> Ansoff (wohin?), Porter (wie gewinnen?), Verhalten gegenüber Lieferanten und Stakeholdern","<b>Maßnahmen:</b> Sortiment, Service, Beschwerdemanagement, Marke, Standort","<b>Bewerten und kontrollieren:</b> Nutzwertanalyse, Kennzahlen, Test"],kl:"Jeder Antwortsatz = <b>Fachbegriff + Fallbezug + Begründung</b> (≈ 2 Punkte). Kurzfristige (operative) und langfristige (strategische) Maßnahmen immer trennen.",task:{q:"Ein Händler verliert Umsatz, weil ein Discounter eröffnet hat. In welcher Reihenfolge gehen Sie bei der Lösung vor? (4 Punkte)",a:"Zuerst analysiere ich Umfeld und eigene Situation, z. B. mit einer SWOT-Analyse, in der der Discounter als Risiko (Rivalität) erscheint. Daraus leite ich eine Strategie ab, etwa Differenzierung nach Porter, und plane konkrete Maßnahmen wie Service und Sortiment, deren Erfolg anschließend kontrolliert wird."}},
{t:"PESTEL-Analyse und interne Ressourcen",g:G.pestel,what:"PESTEL erfasst die <b>externen Einflüsse der Makroumwelt</b>, auf die das Unternehmen keinen Einfluss hat. Die Ressourcenanalyse zeigt die <b>internen</b> Möglichkeiten.",steps:["<b>P</b>olitisch – <b>E</b>conomic/ökonomisch – <b>S</b>oziokulturell – <b>T</b>echnologisch – <b>E</b>nvironmental/ökologisch – <b>L</b>egal/rechtlich","<b>Ressourcen:</b> greifbar (Produkte, Patente, Technologien), nicht greifbar (Image), Human Resources (Know-how, Erfahrung), finanziell (Liquidität, Kapital)","Positive Umfeldfaktoren mit den eigenen Ressourcen <b>ausnutzen</b>, negativen <b>ausweichen</b>"],ex:"Skript: Werden Korkbäume knapp (ökologischer Faktor), muss der Supermarkt Wein mit Schraubverschluss verkaufen – daran kann er nichts ändern.",kl:"PESTEL liefert die <b>Chancen und Risiken</b> für die SWOT. Ordne jeden Umfeldfaktor aus dem Fall einem Buchstaben zu.",task:{q:"Ordnen Sie zu: (a) steigende Energiepreise, (b) Trend zu veganer Ernährung, (c) neues Lieferkettengesetz. (3 Punkte)",a:"(a) ökonomisch (Economic), (b) soziokulturell (Wertewandel), (c) rechtlich (Legal)."}},
{t:"SWOT-Analyse und SWOT-Matrix",g:G.swot,what:"Die SWOT verbindet interne Analyse (Stärken/Schwächen) mit externer Analyse (Chancen/Risiken). Sie steht <b>am Anfang jeder Planung</b> und ist <b>kein Selbstzweck</b>: Aus ihr werden Strategien abgeleitet.",steps:["<b>Stärken und Schwächen</b> sammeln – intern, beeinflussbar. Objektiv erheben: <b>Die Zielgruppe hat das letzte Wort</b>, eine Stärke zählt nur, wenn die Kunden sie bestätigen.","<b>Chancen und Risiken</b> sammeln – extern, nicht beeinflussbar („Das Internet lässt sich nicht abstellen“).","In der <b>Matrix</b> kombinieren: SO Ausbauen, ST Absichern, WO Aufholen, WT Meiden.","<b>Handeln:</b> Der Analyse müssen Maßnahmen folgen."],ex:"Skript-Supermarkt: S = gutes Personal, attraktive Standorte, hohes Eigenkapital · W = veraltete Technik, Sortiment nicht aktuell, geringe Innovationskraft · O = technischer Fortschritt, Wertewandel · T = Preisorientierung der Kunden, mehr Wettbewerb, Ressourcenknappheit.",kl:"Häufigster Fehler: Chancen/Risiken intern formulieren („Wir könnten …“). Chancen und Risiken sind <b>immer Umfeld</b>. Pro Matrixfeld mindestens eine Strategie formulieren.",task:{q:"Ein Supermarkt hat sehr kundenorientiertes Personal; gleichzeitig wächst der Wettbewerb. Welche SWOT-Strategie liegt vor, und was bedeutet sie? (4 Punkte)",a:"Es handelt sich um eine ST-Strategie (Absichern): Eine Stärke wird genutzt, um ein Risiko abzuwehren. Die Kundenorientierung (z. B. Beratung, Service) bindet die Kunden und schwächt so den zunehmenden Wettbewerb ab."}},
{t:"Five Forces nach Porter",g:G.five,what:"Analysiert die <b>Wettbewerbsintensität einer Branche</b> und damit ihre Attraktivität. Porters Idee: Es wäre zu kurzsichtig, nur die direkten Konkurrenten zu betrachten.",steps:["<b>Neue Anbieter:</b> Bedrohung hoch bei niedrigen Markteintrittsbarrieren (wenig Kapitalbedarf, schwache Marken, leichter Zugang zu Kanälen, wenig Vorschriften).","<b>Lieferanten:</b> Macht hoch bei <b>wenigen Lieferanten, einzigartigen Produkten, großer Bedeutung, hohen Wechselkosten</b> → höhere Preise, schlechtere Qualität.","<b>Kunden:</b> Macht hoch bei vielen Anbietern, wenigen großen Käufern, geringen Umstellungskosten, standardisierten Produkten.","<b>Ersatzprodukte:</b> Bedrohung hoch bei gutem Preis-Leistungs-Verhältnis und leichter Verfügbarkeit.","<b>Rivalität:</b> hoch bei vielen gleich starken Wettbewerbern, langsamem Wachstum, austauschbaren Produkten, hohen Fixkosten → Preiskriege."],ex:"Supermarkt: Discounter nebenan (Rivalität), Online-Lieferdienst (neuer Anbieter/Ersatz), Markenmolkerei mit starker TV-Werbung (Lieferantenmacht, weil Kunden die Marke erwarten).",kl:"Bei Lieferantenproblemen <b>immer</b> mit der Lieferantenmacht argumentieren und die Bestimmungsfaktoren am Fall belegen. Gegenmittel: Kooperation/ECR, Handelsmarke, zweiter Lieferant, vertikale Rückwärtsintegration.",task:{q:"Ein Markenhersteller, dessen Produkte Kunden gezielt nachfragen, erhöht die Preise um 9 %. Beurteilen Sie seine Verhandlungsmacht. (4 Punkte)",a:"Die Verhandlungsmacht ist hoch, weil die Marke einzigartig ist und Kunden sie erwarten – eine Auslistung hätte hohe Wechselkosten in Form von Kundenverlusten. Der Händler sollte kooperativ verhandeln (z. B. Gegenleistungen wie Werbekostenzuschüsse) und langfristig über eine Handelsmarke die Abhängigkeit senken."}},
{t:"Markt- und Produktlebenszyklus",g:G.lz,what:"Beide teilen die Entwicklung in <b>5 Phasen</b> und leiten Normstrategien ab. <b>Marktlebenszyklus</b> = ganzer Markt (Gesamtnachfrage + Branchenrentabilität; in der Sättigung: Markt verlassen). <b>Produktlebenszyklus</b> = ein Produkt (Umsatz + Gewinn).",steps:["<b>Einführung:</b> hohe Kosten, sehr hoher Werbedruck, Innovatoren; Preisstrategie auf dem Prüfstand; Lieferanten müssen sich bewähren. Endet am <b>Break-even-Point</b>.","<b>Wachstum:</b> Umsatz und Gewinn steigen progressiv; Nachahmer → <b>Produktvariation</b>; Preiskämpfe drohen; neue Absatzmittler gewinnen.","<b>Reife:</b> Wachstum flacht ab → <b>Produktdifferenzierung</b>, Erhaltungswerbung, Preissenkung ohne starke Marke.","<b>Sättigung:</b> Umsatz und Gewinn sinken → <b>Relaunch oder Elimination</b>; Kommunikation runterfahren; <b>Single Sourcing</b>.","<b>Degeneration:</b> kein Gewinn → Elimination (selten Revival), Werbung stoppen, Verträge kündigen."],ex:"Einführungsphase dauert länger bei hoher Erklärungsbedürftigkeit, hohem Neuigkeitswert, geringer Passung zum Bedarf und starker Konkurrenz.",kl:"<b>Kritik am PLZ:</b> rückblickend (man merkt den Abstieg erst, wenn er da ist) und ignoriert <b>Verbundeffekte</b>. Bei sinkenden Umsätzen im Fall: Sättigung → Relaunch oder Elimination begründen.",task:{q:"Ein Produkt hat sinkenden Umsatz und kaum noch Gewinn. Ordnen Sie die Phase zu und nennen Sie zwei Maßnahmen. (4 Punkte)",a:"Das Produkt befindet sich in der Sättigungsphase. Der Händler entscheidet zwischen Relaunch und Elimination, fährt die Kommunikation zurück und reduziert die Beschaffung auf einen Lieferanten (Single Sourcing)."}},
{t:"Szenariotechnik",g:G.szen,what:"Methode, um mögliche Zukunftsbilder zu entwickeln und sich auf sie vorzubereiten – passend zu langfristigen Entscheidungen.",steps:["<b>Schlüsselfaktoren bestimmen</b> (Desk Research, Workshops, Interviews; interdisziplinäre Gruppen)","<b>Schlüsselfaktoren analysieren</b> (Wechselwirkungen, Alternativen, „Wild Cards“)","<b>Szenarien bilden</b> (Storylines: „business as usual“ vs. Handeln)","<b>Szenariotransfer</b> (Anwendung auf dem Weg zum „best case“ – nicht in der Schublade lassen)"]}
],

{q:"Welche Faktoren der SWOT-Analyse sind extern?",o:["Stärken und Schwächen","Chancen und Risiken","Stärken und Chancen","Schwächen und Risiken"],c:1,e:"Chancen und Risiken kommen aus dem Umfeld und sind nicht beeinflussbar."},
{q:"Eine Schwäche trifft auf ein Risiko. Welche Strategie?",o:["SO – Ausbauen","WO – Aufholen","WT – Meiden","ST – Absichern"],c:2,e:"WT: Schwäche + Risiko = größte Gefahr, dringend handeln."},
{q:"Wann ist eine Stärke laut Skript wirklich eine Stärke?",o:["Wenn der Inhaber davon überzeugt ist","Wenn die Kunden sie bestätigen","Wenn sie schon lange besteht","Wenn die Konkurrenz sie nicht hat"],c:1,e:"„Die Zielgruppe hat das letzte Wort.“"},
{q:"Welche Größen misst der Produktlebenszyklus?",o:["Umsatz und Gewinn","Gesamtnachfrage und Branchenrentabilität","Marktwachstum und Marktanteil","Kosten und Preis"],c:0,e:"Der Marktlebenszyklus nutzt Gesamtnachfrage und Rentabilität, die BCG Marktwachstum und rel. Marktanteil."},
{q:"Woran endet die Einführungsphase formal?",o:["Am Umsatzmaximum","Am Break-even-Point","Beim ersten Wettbewerber","Am Gewinnmaximum"],c:1,e:"Ab dem Break-even macht das Produkt Gewinn."},
{q:"In welcher Phase empfiehlt das Skript Single Sourcing?",o:["Einführung","Wachstum","Sättigung","Reife"],c:2,e:"In der Sättigung wird die Beschaffung auf einen Lieferanten reduziert."},
{q:"Wann ist die Verhandlungsmacht der Lieferanten hoch?",o:["Viele Lieferanten, standardisierte Produkte","Wenige Lieferanten, einzigartige Produkte, hohe Wechselkosten","Viele Kunden, geringe Umstellungskosten","Niedrige Markteintrittsbarrieren"],c:1,e:"Genau diese Faktoren nennt das Skript."},
{q:"Der Trend zu veganer Ernährung gehört in PESTEL zu …",o:["Politisch","Ökonomisch","Soziokulturell","Rechtlich"],c:2,e:"Wertewandel ist ein soziokultureller Faktor."},
{q:"Was ist ein Kritikpunkt am Produktlebenszyklus?",o:["Er braucht zu viele Daten","Er ist rückblickend und ignoriert Verbundeffekte","Er gilt nur für Dienstleistungen","Er hat nur drei Phasen"],c:1,e:"Man merkt den Abstieg erst, wenn er da ist, und Verbundeffekte fehlen."},
{q:"Was empfiehlt der Marktlebenszyklus für einen Markt in der Sättigung?",o:["Investieren","Markt verlassen","Preise erhöhen","Werbedruck erhöhen"],c:1,e:"Ein gesättigter Markt stagniert und wird schrumpfen."}
]},
{id:"k6",tab:"Kap. 6 · Strategien",title:"Kapitel 6 – Marketingstrategien und strategische Optionen",intro:"Strategien sind die <b>langfristige Verhaltensgrundlage</b>. Sie werden mit langem Zeithorizont vorausschauend geplant und brauchen eine belastbare Grundlage – die Analysen aus Kapitel 5.",
models:[
{t:"Instrumente: 7P und 4C",g:G.p7,what:"Die <b>7P</b> sind die Marketinginstrumente: die klassischen 4P (Produkt, Preis, Kommunikation, Distribution) plus Personal, Process Management und Physical Factors – wichtig, weil auch Dienstleistungen vermarktet werden. Das <b>4-C-Modell</b> betrachtet das Angebot aus Kundensicht.",steps:["<b>Consumer:</b> Welchen Mehrwert bieten wir?","<b>Cost:</b> Welche zusätzlichen Kosten hat der Kunde (Strom, Recherche …)?","<b>Convenience:</b> Wie wird der Kaufprozess bequem?","<b>Communication:</b> Wie wird der Dialog angenehm und intensiv?"],ex:"Modegeschäft: WhatsApp-Info zu neuen Lieblingsmodellen, Getränk für die Begleitung, Änderungsservice, Click&amp;Collect mit vernetzten Kanälen.",task:{q:"Nennen Sie die drei „neuen“ P mit je einem Handelsbeispiel. (3 Punkte)",a:"Personal (Beratungsqualität), Process Management (Click&amp;Collect), Physical Factors (Ambiente, Visual Merchandising)."}},
{t:"Produkt-Markt-Matrix nach Ansoff",g:G.ansoff,what:"Vier <b>Wachstumsstrategien</b>, je nachdem ob Produkt und Markt alt oder neu sind. Je mehr Neues, desto höher das Risiko.",steps:["<b>Marktdurchdringung</b> (Risiko gering): Verkaufsförderung, Kunden der Konkurrenz abwerben, Nicht-Kunden gewinnen.","<b>Marktentwicklung</b> (Risiko höher, neue Zielgruppe): neue Standorte, neue Segmente, neuer Verwendungszweck.","<b>Produktentwicklung</b> (Risiko hoch): Innovation/Variation; Sortiment oder Betriebsform ändern.","<b>Diversifikation</b> (Risiko am höchsten): <i>horizontal</i> (verwandt, gleiche Stufe: Kinder- + Damenschuhe), <i>vertikal</i> (Vorstufe: Bäcker mit Hühnerhof; Nachstufe: Dr. Oetker kauft Flaschenpost), <i>lateral</i> (branchenfremd: ALDI Talk)."],kl:"Neue Filiale = <b>Marktentwicklung</b>; Eigenmarke/neues Sortiment für Stammkunden = <b>Produktentwicklung</b>. Immer das Risiko nennen. Vertikale Rückwärtsintegration ist eine Antwort auf übermächtige Lieferanten.",task:{q:"Ein Lebensmittelhändler eröffnet mit unverändertem Sortiment eine Filiale in einer Nachbarstadt. Ordnen Sie zu und beurteilen Sie das Risiko. (4 Punkte)",a:"Es handelt sich um Marktentwicklung nach Ansoff, da das bestehende Sortiment auf einem neuen Markt angeboten wird. Das Risiko ist höher als bei der Marktdurchdringung, weil die Zielgruppe neu und unbekannt ist."}},
{t:"Portfolio-Analyse (BCG-Matrix)",g:G.bcg,what:"Entwickelt 1970 von Bruce Henderson (BCG). Ordnet Produkte oder <b>Strategische Geschäftseinheiten</b> nach <b>Marktwachstum</b> und <b>relativem Marktanteil</b> ein und liefert <b>Normstrategien</b>. Eine SGE hat eigenen Erfolgsbeitrag, eigene Kunden, eigene Konkurrenz, eigene Chancen/Risiken und eigene Führung (Handel: z. B. Food/Non-Food).",steps:["Matrix zeichnen: y = Marktwachstum, x = relativer Marktanteil","Trennlinie rel. Marktanteil bei <b>1</b> (eigener MA ÷ MA des stärksten Konkurrenten)","Trennlinie Marktwachstum = <b>arithmetisches Mittel</b> der Wachstumswerte","SGE als Kreise eintragen – <b>Kreisgröße = Umsatz</b>","Normstrategien: Question Marks offensiv investieren oder desinvestieren · Stars investieren · Cash Cows abschöpfen · Poor Dogs loswerden (Skript: „abschöpfen“)"],kl:"Ein gesundes Portfolio braucht Question Marks → Stars → Cash Cows (Cash Cows finanzieren den Nachwuchs). <b>Grenze:</b> nur zwei Dimensionen; bei Question Marks keine eindeutige Entscheidung.",task:{q:"Eine Warengruppe hat einen relativen Marktanteil von 1,8 bei unterdurchschnittlichem Marktwachstum. Einordnung und Normstrategie? (4 Punkte)",a:"Die Warengruppe ist eine Cash Cow, da sie Marktführer (rel. MA > 1) in einem wenig wachsenden Markt ist. Normstrategie ist Abschöpfen: Die Überschüsse finanzieren Question Marks und Stars."}},
{t:"Wettbewerbsstrategien nach Porter",g:G.porter,what:"Wie erreicht man einen <b>Wettbewerbsvorteil</b>? Über <b>Kosten oder Leistung</b> – für den <b>Gesamtmarkt oder einen Teilmarkt</b>. Porter: Positionierung nie nur über den Preis.",steps:["<b>Kostenführerschaft:</b> niedrigste Kosten (Skaleneffekte, Kostenkontrolle) → Preise unter Durchschnitt. Risiko: Qualitätsverlust, Nachahmer.","<b>Differenzierung:</b> einzigartige Leistung, Marke, Service; Voraussetzung ist eine <b>USP</b> → höhere Preise, Loyalität. Risiko: hohe Kosten, Einzigartigkeit wird nicht wahrgenommen.","<b>Fokus/Nische:</b> Spezialisierung auf ein Segment (mit Kosten- oder Leistungsvorteil). Risiko: Abhängigkeit, Große erobern die Nische.","<b>Stuck in the middle:</b> weder Kosten- noch Leistungsvorteil → kein Wettbewerbsvorteil.","Verwandt: <b>Präferenzstrategie</b> (Kauf wegen Leistung/Image) vs. <b>Preis-Mengen-Strategie</b> (Preis ist das Hauptargument)."],kl:"Mittelständischer Händler gegen Discounter: <b>Differenzierung/Präferenzstrategie</b> empfehlen (Frische, Beratung, Regionalität) – einen Preiskampf gegen die Kostenstruktur des Discounters kann er nicht gewinnen.",task:{q:"Ein inhabergeführter Supermarkt ist weder billiger als der Discounter noch besonders im Service. Diagnose und Empfehlung? (6 Punkte)",a:"Der Supermarkt ist „stuck in the middle“, weil er weder einen Kosten- noch einen Leistungsvorteil hat. Ich empfehle die Differenzierungsstrategie, z. B. über Frische, regionale Produkte und Beratung als USP. Ein Preiskampf ist nicht zu gewinnen, das Risiko höherer Kosten wird durch höhere Preisbereitschaft der Kunden ausgeglichen."}},
{t:"Push/Pull und Macht Hersteller – Handel",g:G.push,what:"Wie bringen Hersteller (= Lieferanten) ihre Produkte in den Handel, und wer hat die Macht?",steps:["<b>Push:</b> Maßnahmen an den <b>Handel</b> – Werbekostenzuschüsse, Ladenbau, Rabatte. Der Händler hat Verhandlungsspielraum.","<b>Pull:</b> Maßnahmen an den <b>Endkunden</b> – Werbung erzeugt Nachfragesog, der Händler „muss“ listen. Die Lieferantenmacht steigt.","<b>Machtverschiebung zum Handel:</b> Handelsmarken (seit den 1960er/70ern, ALDI, Lidl): 40,2 % Anteil im LEH 2022, 50,9 % bei Tiefkühlkost; 64 % halten sie für hochwertig, 68 % für vertrauenswürdig. Scannerkassen geben dem Handel einen Informationsvorsprung. Herstellermarken riskieren die Auslistung."],kl:"Fordert ein Markenhersteller mehr Geld oder Regalfläche: Pull-Stärke einschätzen, Push-Gegenleistungen verhandeln, langfristig eine Handelsmarke als Alternative aufbauen.",task:{q:"Erklären Sie, warum Handelsmarken die Machtposition des Handels gegenüber Herstellern stärken. (4 Punkte)",a:"Mit eigenen Handelsmarken kann der Händler Herstellermarken ersetzen und ist nicht mehr gezwungen, jede Marke zu listen. Da Kunden Handelsmarken als hochwertig und vertrauenswürdig ansehen, droht Herstellern die Auslistung, was die Verhandlungsposition des Handels stärkt."}},
{t:"Verhaltensstrategien",g:G.verh,what:"Verhalten in der <b>horizontalen</b> (Konkurrenten) und <b>vertikalen</b> (Hersteller ↔ Handel) Auseinandersetzung – Matrix aus innovativ/imitativ und wettbewerbsvermeidend/-stellend.",steps:["<b>Ausweichen/Umgehung:</b> so innovative Marke, dass kein Wettbewerber vergleichbar ist; Hersteller umgeht den Handel (Onlineshop, Flagship-Store, Outlet, Pop-up, Messe).","<b>Anpassung:</b> kein USP, nur Listung angestrebt → der Handel bestimmt die Bedingungen.","<b>Konflikt:</b> stagnierender Markt, Kampf um Marktanteile; der Mächtigere diktiert.","<b>Kooperation:</b> austauschbare Produkte, harter Markt → Partnerschaft über <b>ECR</b>.","<b>Multi-Channel:</b> Kanäle abgestimmt · <b>Omni-Channel:</b> Kanäle vollständig integriert, Kunde wird überall erkannt."],kl:"Bei Lieferantenkonflikten meist <b>Kooperation</b> empfehlen (weniger Fehlbestände, beide profitieren) – außer der Lieferant ist austauschbar und der Händler klar mächtiger.",task:{q:"Ein Hersteller verkauft seine Produkte zunehmend über einen eigenen Onlineshop und eigene Flagship-Stores. Welche Strategie verfolgt er? (2 Punkte)",a:"Eine Umgehungs- bzw. Ausweichstrategie: Er umgeht den Handel über eigene Vertriebswege."}},
{t:"Stakeholder-Strategien",g:G.stake,what:"Reaktion auf Forderungen von Anspruchsgruppen (Medien, Initiativen, NGOs). Entscheidend: Dringlichkeit der Ansprüche, Stärke der Stakeholder, eigene Unternehmenskultur.",steps:["<b>Innovation:</b> früh reagieren und kooperieren → Wettbewerbsvorteil (vegane Produkte früh listen, früher Rückzug aus Russland)","<b>Anpassung:</b> erst handeln, wenn es unumgänglich ist → Innovationen wirken nicht mehr als eigene Leistung","<b>Widerstand:</b> Status quo, Lobbyismus → langfristig Imageschaden","<b>Ausweichen:</b> Probleme verlagern (Handelsmarkenproduktion in Niedriglohnländer) → Täuschungsvorwurf","<b>Passivität:</b> Gruppen ignorieren → werden unterschätzt"],kl:"Bei öffentlicher Kritik (Tierwohl, Nachhaltigkeit, Lieferkette) die <b>Innovationsstrategie</b> empfehlen und die anderen als Gegenargumente abgrenzen.",task:{q:"Eine Bürgerinitiative kritisiert öffentlich das Fleischangebot eines Händlers. Empfehlen Sie eine Strategie. (4 Punkte)",a:"Ich empfehle die Innovationsstrategie: Der Händler sucht das Gespräch und stellt frühzeitig auf höhere Haltungsformen und regionale Erzeuger um. So wird Kritik zum Profilierungsvorteil, während Widerstand langfristig das Image schädigen würde."}},
{t:"Markteintritt: Timing und Internationalisierung",g:G.intl,what:"<b>Wann</b> und <b>wie</b> tritt man in einen neuen Markt ein? Gewinnmaximierung und Risikominimierung sind gleichberechtigte Ziele.",steps:["<b>First Mover:</b> Markt definieren, erste Anteile – hohe Kosten, Unsicherheit","<b>Late Mover:</b> aus Fehlern lernen, niedrigere Kosten – etablierte Konkurrenz","<b>Wasserfall:</b> schrittweise mit Testmarkt – Konkurrenz kann schneller sein","<b>Sprinkler:</b> alle Märkte gleichzeitig – hohe Kosten, Floprisiko","<b>Ausland:</b> Export → Lizenz → Joint Venture → Direktinvestition (Greenfield oder Akquisition); Kapitaleinsatz, Risiko und Kontrolle steigen. Brückenkopf: ein Land als Basis für Nachbarländer."],kl:"Für einen Mittelständler mit begrenzten Mitteln ist die <b>Wasserfallstrategie</b> meist gut begründbar.",task:{q:"Nennen Sie je einen Vorteil und ein Risiko eines Joint Ventures. (2 Punkte)",a:"Vorteil: Zugang zu lokaler Marktkenntnis und Risikoteilung. Risiko: Konflikte mit dem Partner und komplexe Entscheidungen."}}
],
quiz:[
{q:"Ein Händler eröffnet mit gleichem Sortiment eine neue Filiale in einer anderen Stadt. Ansoff-Strategie?",o:["Marktdurchdringung","Produktentwicklung","Marktentwicklung","Diversifikation"],c:2,e:"Altes Produkt, neuer Markt."},
{q:"Welche Ansoff-Strategie hat das höchste Risiko?",o:["Laterale Diversifikation","Marktdurchdringung","Horizontale Diversifikation","Marktentwicklung"],c:0,e:"Neue Produkte, neue Zielgruppe, fremde Branche."},
{q:"Ein Bäcker betreibt einen eigenen Hühnerhof für die Eier. Das ist …",o:["horizontale Diversifikation","vertikale Diversifikation (Vorstufe)","laterale Diversifikation","Marktdurchdringung"],c:1,e:"Vorgelagerte Wertschöpfungsstufe."},
{q:"Wo liegt in der BCG-Matrix die Trennlinie beim relativen Marktanteil?",o:["bei 0,5","beim Mittelwert","bei 1","bei 10 %"],c:2,e:"Bei 1 – darüber ist man Marktführer."},
{q:"Normstrategie für Stars?",o:["Abschöpfen","Investieren","Desinvestieren","Abwarten"],c:1,e:"Stars werden intensiv betreut, damit sie Cash Cows werden."},
{q:"Was bedeutet „stuck in the middle“?",o:["Marktanteil genau 1","Weder Kosten- noch Leistungsvorteil","Mittleres Marktwachstum","Mittlere Preislage als Strategie"],c:1,e:"Kein Wettbewerbsvorteil."},
{q:"Was ist Voraussetzung für die Differenzierungsstrategie?",o:["Skaleneffekte","Eine USP","Niedrige Kosten","Ein großes Lager"],c:1,e:"Unique Selling Proposition – Alleinstellungsmerkmal."},
{q:"Bei der Pull-Strategie richten sich die Maßnahmen des Herstellers an …",o:["den Großhandel","den Einzelhandel","den Endkunden","die Lieferanten"],c:2,e:"Nachfragesog beim Endkunden."},
{q:"Austauschbare Produkte, hart umkämpfter Markt – Hersteller und Handel werden Partner. Strategie?",o:["Konflikt","Anpassung","Kooperation (ECR)","Umgehung"],c:2,e:"Kooperation über Efficient Consumer Response."},
{q:"Ein Händler listet als Erster vegane Produkte, weil der Wertewandel absehbar ist. Stakeholder-Strategie?",o:["Innovation","Anpassung","Widerstand","Ausweichen"],c:0,e:"Frühzeitige Reaktion = Innovationsstrategie."},
{q:"Markteintritt schrittweise mit Testmarkt heißt …",o:["Sprinkler","Wasserfall","First Mover","Brückenkopf"],c:1,e:"Sequenzieller Markteintritt."},
{q:"Welche Internationalisierungsform hat den höchsten Kapitaleinsatz, aber auch die meiste Kontrolle?",o:["Export","Lizenz","Joint Venture","Direktinvestition"],c:3,e:"Eigene Gesellschaft im Ausland."}
]},
{id:"k8",tab:"Kap. 8.1 · Sortiment",title:"Kapitel 8.1 – Produkt- und Sortimentspolitik",intro:"Im Handel spricht man von <b>Produkt- und Sortimentspolitik</b>: die richtigen Produkte auswählen und zu einem optimalen, kaufanregenden Sortiment zusammenstellen. Entscheidend ist die <b>Sicht des Kunden</b>. Oft entscheidet nicht der Grundnutzen, sondern der <b>Zusatznutzen</b> – und der Zusatznutzen von heute ist die Selbstverständlichkeit von morgen. Dauerhaft hilft nur eine <b>USP</b>.",
models:[
{t:"Visual Merchandising und Verkaufsraum",g:G.vm,what:"Optische Inszenierung von Verkaufsflächen und Warenpräsentation – Teil der <b>Physical Factors</b>, basiert auf der Corporate Identity. Ziele: Zufriedenheit, Kundenbindung, höherer Durchschnittsbon, längere Verweildauer, höhere Flächenproduktivität.",steps:["<b>Quantitative Raumzuteilung</b> nach Deckungsbeitrag, Handelsspanne, Produktart (Pflicht-, Ergänzungs-, Saisonartikel), Marke, Kaufhäufigkeit, Verpackungsgröße","<b>Qualitative Raumzuteilung</b> nach Wertigkeit der Zonen (siehe Tabelle) und Platzierung im Regal (Griffhöhe für gut kalkulierte Produkte)","<b>Präsentation:</b> isoliert (Blickfang), Tisch (Aufwertung), Verbund/Warenlandschaft (Grillen, Ostern), Zweitplatzierung, Wühltisch am Eingang (Preiswürdigkeit)","<b>Atmosphäre:</b> Musik, ca. 19 °C, helles Licht, Backduft am Eingang, breite Gänge"],task:{q:"Wo sollte ein Händler einen neuen, gut kalkulierten Artikel platzieren? (2 Punkte)",a:"In einer hochwertigen Zone, z. B. rechts vom Kundenstrom an einem Hauptweg und im Regal in Griffhöhe."}},
{t:"Category Management und ECR",g:G.cm,what:"Produkte werden zu <b>Kategorien</b> (strategischen Warengruppen nach Kundenbedürfnissen) gebündelt und als <b>eigene Geschäftseinheiten</b> geführt. Funktioniert nur in <b>enger Zusammenarbeit von Handel und Herstellern</b>.",steps:["Sortiment analysieren (Stärken/Schwächen je Warengruppe)","Kundenpotenzial analysieren (Wer? Was? Wie oft? Zu welchem Preis?)","Ziele und Strategie festlegen (Rolle: Basis-, Wachstums-, Nischen-, Saisonkategorie)","Strategie in ausgewählten Geschäften testen","Bewerten (Abweichung + / −)","Umsetzen","Kontrollieren"],ex:"Voraussetzungen: ganzheitliche Wertschöpfungskette, klare Zuordnung von Produkten und Zielgruppen, eigene Maßnahmen und eigener Erfolgsbeitrag je Kategorie, Vertrauen und Datenaustausch (EAN, Scanning).",kl:"CM/ECR ist <b>die</b> Lösung für Lieferantenprobleme bei austauschbaren Produkten: weniger leere Regale (Replenishment), weniger Flops (Product Introduction), günstigere Aktionen (Promotion).",task:{q:"Bei Aktionen sind die Regale eines Supermarkts regelmäßig leer. Welche ECR-Säulen helfen, und wie? (4 Punkte)",a:"Efficient Promotion sorgt durch gemeinsame Aktionsplanung mit dem Hersteller dafür, dass die Ware zum Aktionsstart vollständig verfügbar ist. Efficient Replenishment optimiert den Nachschub durch geteilte Lagerdaten, automatische Disposition und Just-in-Time-Belieferung."}},
{t:"Sortimentsentscheidungen und Produktelimination",g:G.sort,what:"Das Sortiment wird überwacht, verändert, ergänzt und bereinigt – Ziel ist das optimale Sortiment aus Kundensicht.",steps:["<b>Variation:</b> Produkt wird verändert, alte Version verschwindet (Saft in Glas statt PET) → Anzahl gleich","<b>Differenzierung:</b> zusätzliche parallele Varianten (neue Sorten) → Anzahl steigt","<b>Elimination – dafür:</b> sinkender Umsatz, Rentabilität, Marktanteil; Komplexitätskosten; Imageschaden; neue Strategie, Kundenwünsche, Gesetze, Technologien","<b>Elimination – dagegen:</b> <b>Verbundeffekte</b> (Bockwurst → Senf), positiver Deckungsbeitrag, <b>langfristige Lieferverträge</b>, Imageverlust, Auslastung → Bonanalyse!","<b>Neuheiten:</b> echte Innovation (selten), Marktneuheit, quasi-neu (Verbesserung), Me-too (Nachahmung, am häufigsten)","<b>Vertiefung:</b> Substitutionseffekt (Kannibalisierung), Partizipationseffekt (Kunden von der Konkurrenz), Bedarfserweiterung; Kosten steigen"],kl:"Nie einfach „auslisten“ schreiben – immer Gründe dafür <b>und</b> dagegen abwägen.",task:{q:"Ein Senf verkauft sich schlecht. Spricht etwas gegen die Auslistung der dazugehörigen Bockwurst-Aktion? Erklären Sie den Fachbegriff. (4 Punkte)",a:"Ja, es bestehen Verbundeffekte: Produkte werden zusammen gekauft, sodass das Entfernen eines Artikels den Absatz eines anderen senkt. Solche Zusammenhänge werden über die Bonanalyse aufgedeckt und müssen vor einer Elimination geprüft werden."}},
{t:"Nutzwertanalyse / Scoring-Modell",g:G.nwa,what:"Verfahren, um zwischen Alternativen (Produktideen, Standorte, Lieferanten) <b>objektiv und nachvollziehbar</b> zu entscheiden – auch bei nicht in Geld messbaren Kriterien.",steps:["Kriterien festlegen","Kriterien gewichten (Summe = 1 bzw. 100 %)","Alternativen je Kriterium benoten","Note × Gewicht = Teilnutzen","Summieren → höchster Gesamtnutzwert gewinnt"],kl:"Schwäche: Gewichtung und Noten sind subjektiv. Vorher Selektionsfragen: wirtschaftlich tragfähig (Break-even)? Passend zum Produkt-Mix? Mittel vorhanden? Konkurrenzangebot?",task:{q:"Standort X erhält bei Kaufkraft (Gewicht 0,5) Note 8 und bei Miete (0,5) Note 4; Standort Y Note 6 und 7. Welcher gewinnt? (2 Punkte)",a:"X: 0,5 × 8 + 0,5 × 4 = 6,0; Y: 0,5 × 6 + 0,5 × 7 = 6,5 → Standort Y."}},
{t:"Positionierungsanalyse (Nischen finden)",g:G.pos,what:"Zeigt, wo sich Konkurrenten im Eigenschaftsraum befinden, der für Kunden wichtig ist. Leere Felder sind mögliche <b>Marktlücken</b> (Nachfrage, die nicht oder unzureichend gedeckt ist).",steps:["Gegensatzpaare festlegen (mit Marktforschung belegt)","Bewertungsskala festlegen","Paare als Achsen anordnen","Konkurrenten einzeichnen (Kreisgröße = Umsatz)","Leere Felder prüfen: Gibt es am Ort eine Zielgruppe? („Man kann sich seine Kunden nicht backen.“)"]},
{t:"Service und KANO-Modell",g:G.kano,what:"Produkte werden austauschbar – die Profilierung erfolgt über <b>Service</b> (Pre-, At-, After-Sales). Das KANO-Modell zeigt, welche Merkmale zufrieden machen.",steps:["<b>Basismerkmale:</b> selbstverständlich; fehlen sie → Unzufriedenheit (Lebensmittel bekommen)","<b>Leistungsmerkmale:</b> je mehr, desto zufriedener (Verkostung, Beratung)","<b>Begeisterungsmerkmale:</b> unerwartet, begeistern (Einpackservice, Vorbestellung)","<b>Betriebsformen:</b> Discounter kaum Service · Supermarkt Bedientheken · Fachgeschäft Beratung, Installation, Reparatur · Fachmarkt Lieferung, Montage, Tiefpreisgarantie"],kl:"Dynamik: Die Begeisterung von heute ist die Basis von morgen → Service ständig weiterentwickeln.",task:{q:"Ordnen Sie zu: kostenloser Einpackservice, frische Ware, Beratung an der Käsetheke. (3 Punkte)",a:"Einpackservice = Begeisterungsmerkmal, frische Ware = Basismerkmal, Beratung = Leistungsmerkmal."}},
{t:"Beschwerdemanagement",g:G.besch,what:"Systematische Bearbeitung von Beschwerden, um <b>negative Erlebnisse in positive zu verwandeln</b>, Kunden zu binden und zu lernen. Eingebunden in Servicepolitik bzw. CRM.",steps:["<b>Direkt</b> (zum Kunden): zu Beschwerden auffordern über eigene, gesteuerte Kanäle (Website, Telefon – nicht anonym in Social Media); Mitarbeiter kennen Ablauf und Lösungen","<b>Indirekt</b> (intern): Auswertung/Analyse, Reporting an Entscheider, Controlling – beides verzahnen","<b>Phasen:</b> 1 Stimulierung (eine info@-Adresse reicht nicht) → 2 Annahme (vollständig dokumentieren) → 3 Bearbeitung (Standards, Eskalationsstufen) → 4 Reaktion (finanziell, materiell, immateriell) → 5 Auswertung (muss zu Veränderungen führen)"],kl:"Beschwerden nur mündlich am Infopunkt? → Kanäle schaffen, Prozess standardisieren, Auswertung einführen und mit dem Fall verknüpfen (z. B. leere Regale → Disposition mit Lieferant ändern).",task:{q:"Erläutern Sie den Unterschied zwischen direktem und indirektem Beschwerdemanagement. (4 Punkte)",a:"Das direkte Beschwerdemanagement umfasst den Kontakt mit dem Kunden, also Stimulierung, Annahme, Bearbeitung und Reaktion. Das indirekte findet intern statt: Beschwerden werden ausgewertet, an Entscheider berichtet und kontrolliert, damit Fehler künftig vermieden werden."}},
{t:"GAP-Analyse",g:G.gap,what:"Findet die Lücke zwischen <b>Soll</b> (Ziel) und <b>Ist</b> (weiter wie bisher) und fragt, mit welchen Maßnahmen sie geschlossen wird.",steps:["<b>Operative Lücke</b> → kurzfristig: Verkaufsförderung, Sortiment anpassen, Verkaufsraum umgestalten","<b>Strategische Lücke</b> → langfristig: Mitarbeiter fortbilden, Fläche vergrößern, Standort wechseln","<b>Service-GAPs 1–4</b> siehe Tabelle"],kl:"Ideal für „nicht alles läuft rund“: Lücke benennen, operativ vs. strategisch trennen, passende GAP-Nummer zuordnen.",task:{q:"Für die Frischetheke gilt eine maximale Wartezeit von 3 Minuten, das Personal hält sie nicht ein. Welche Lücke? (2 Punkte)",a:"GAP 3: Der Standard ist richtig definiert, wird aber vom Personal nicht umgesetzt → Personalplanung und Schulung."}},
{t:"Marke und Markenstrategien",g:G.marke,what:"Eine Marke ist formal ein Name/Zeichen zur Unterscheidung, heute vor allem ein <b>im Kopf des Kunden verankertes Vorstellungsbild</b>. Ziele: Präferenzen, Markentreue, Differenzierung, Image, Ubiquität, preispolitischer Spielraum. Funktionen für Kunden: Orientierung, Vertrauen, Qualitätsvermutung, Prestige.",steps:["<b>Vertikaler Wettbewerb:</b> Handelsmarke vs. Herstellermarke (River-Cola vs. Coca-Cola)","<b>Horizontaler Wettbewerb:</b> Herstellermarken untereinander (Pepsi vs. Coca-Cola)","<b>Gattungsmarken</b> (No Name): Mindestqualität, ca. 40 % billiger · <b>klassische Handelsmarken</b> (Balea, 5th Avenue): vergleichbare Qualität, Preisvorteil","<b>Markenstrategien:</b> Einzel-, Familien-, Dach-, Mehrmarke (siehe Grafik)","<b>Eintragung DPMA:</b> eindeutig, nicht täuschend, keine Hoheitszeichen, keine Gattungs-/Ortsbezeichnung, kein Freihaltebedürfnis verletzt"],kl:"Eigenmarke eines Händlers = Produktentwicklung (Ansoff) + Gegengewicht zur Lieferantenmacht; meist <b>Familienmarke</b> empfehlen und das Risiko nennen.",task:{q:"Ein Händler will unter „Heimat“ regionale Produkte als Eigenmarke führen. Empfehlen Sie eine Markenstrategie. (4 Punkte)",a:"Ich empfehle eine Familienmarke, da alle regionalen Produkte gemeinsam beworben werden und sich das Vertrauen von einem Produkt auf die anderen überträgt. Risiko: Ein Qualitätsproblem eines Erzeugers schadet der ganzen Marke, daher sind sorgfältige Lieferantenauswahl und Markenschutz beim DPMA nötig."}},
{t:"Standortwahl und Standortanalyse",g:G.standort,what:"Die Standortwahl ist eine <b>langfristig wirksame Entscheidung</b>: hohe Investition, kaum umkehrbar. Besonderheit im Handel: Eine neue Filiale nimmt den <b>eigenen Filialen Umsatz weg</b> → das ganze <b>Verkaufsstellennetz</b> planen.",steps:["<b>Einzugsgebiet abgrenzen:</b> Erfahrungswerte, Gravitationsmodelle, Befragungen, Zeitdistanzmethode","<b>Faktoren analysieren:</b> Demografie, Kaufkraft, Konkurrenz, Verkehr/Parkplätze, Objekt, Kosten (Miete, Personal, Lieferkosten)","<b>Abgestuft bewerten:</b> Lage → Siedlungsgebiet → Zentralität → Konkurrenzdruck → Kundenfrequenz","<b>Entscheiden:</b> Checkliste, Scoring-Modell, Investitionsrechnung","<b>Standortlagen:</b> Typ 1 nahe Wohnorten (Nahversorger) · 2 nahe Konkurrenz (Vergleichskauf) · 3 nahe ergänzenden Sortimenten (Textil/Schuhe) · 4 nahe Passantenströmen (Impulskauf) · 5 verkehrsgünstig (Flächenbedarf)","<b>Kooperationen:</b> Werbegemeinschaft, City-Management, Stadtmarketing, Business Improvement District (4–5 Jahre, alle zahlen)"],kl:"Neue Filiale = Ansoff-Marktentwicklung + Kannibalisierung bestehender Filialen + Scoring-Modell mit Kriterien aus dem Fall. Ambivalent: Konkurrenz kann stören oder beleben; Kaufkraft wird evtl. am Arbeitsort ausgegeben.",task:{q:"Warum ist die Standortentscheidung im Handel komplexer als die Eröffnung eines einzelnen Geschäfts? (4 Punkte)",a:"Eine neue Filiale beeinflusst auch die Umsätze der bestehenden Filialen, weil Kunden eines Einzugsgebiets dann zwischen zwei eigenen Geschäften wählen können. Deshalb muss das gesamte Verkaufsstellennetz geplant werden, nicht nur der einzelne Standort."}}
],

var FALL={case:"<b>Frischemarkt Behrens GmbH</b> – vier Supermärkte in dritter Generation, hohe Eigenkapitalquote, freundliches, erfahrenes Personal, gute Wohngebietslagen. Der Umsatz ist in zwei Jahren um 8 % gesunken, das Ziel wurde verfehlt.<br><br><b>Probleme:</b> Ein Discounter hat 600 m entfernt eröffnet, ein Online-Lieferdienst bietet Lebensmittel an. Kunden beschweren sich über leere Regale bei Aktionsartikeln und lange Wartezeiten an der Frischetheke; Beschwerden werden nur mündlich am Infopunkt angenommen. Das Sortiment gilt als altmodisch, vegane und regionale Produkte fehlen. Der Hauptlieferant für Molkereiprodukte – ein großer Markenhersteller mit stark beworbenen Marken – kündigt 9 % Preiserhöhung an und verlangt mehr Regalfläche für eine neue Produktlinie. Eine örtliche Initiative kritisiert das Fleischangebot.<br><br><b>Langfristige Entscheidungen:</b> (a) fünfter Markt in einem neuen Wohngebiet, (b) Einführung der Eigenmarke „Behrens Heimat“.",
tasks:[
[8,"Erstellen Sie eine SWOT-Analyse (je Feld zwei Aspekte).","<b>Stärken:</b> hohe Eigenkapitalquote; kundenorientiertes, erfahrenes Personal; gute Wohngebietslagen.<br><b>Schwächen:</b> veraltetes Sortiment ohne vegane/regionale Produkte; leere Aktionsregale; kein systematisches Beschwerdemanagement.<br><b>Chancen:</b> Wertewandel zu veganer, regionaler, tierwohlgerechter Ernährung; neues Wohngebiet als Marktpotenzial.<br><b>Risiken:</b> Discounter und Online-Lieferdienst (Wettbewerb); Preiserhöhung und Machtanspruch des Lieferanten; öffentliche Kritik."],
[6,"Leiten Sie je eine SO- und eine WT-Strategie ab.","<b>SO (Ausbauen):</b> Personal und Eigenkapital werden genutzt, um den Wertewandel aufzugreifen: regionale, vegane und tierwohlgerechte Sortimente mit Beratung und Verkostung. <b>WT (Meiden):</b> Das veraltete Sortiment trifft auf preisorientierte Discounter-Konkurrenz – daher kein Preiskampf, sondern klare Abgrenzung über Frische, Regionalität und Service, damit Behrens nicht „stuck in the middle“ bleibt."],
[6,"Analysieren Sie die Verhandlungsmacht des Molkerei-Lieferanten (Five Forces) und empfehlen Sie eine Verhaltensstrategie.","Die Lieferantenmacht ist hoch, weil die stark beworbenen Marken einen Pull-Effekt erzeugen und ein Wechsel Kunden kosten würde (hohe Wechselkosten). Zudem ist Behrens als kleiner Filialist für den Großhersteller wenig bedeutend. Ich empfehle eine Kooperationsstrategie im Sinne von ECR/Category Management (gemeinsame Bedarfsplanung, Efficient Promotion gegen leere Aktionsregale) und langfristig den Aufbau einer Handelsmarke, um die Abhängigkeit zu senken."],
[4,"Soll Behrens der Forderung nach mehr Regalfläche nachkommen?","Die Fläche sollte nur nach den Kriterien der quantitativen Raumzuteilung (Deckungsbeitrag, Handelsspanne, Kaufhäufigkeit) und nach einem positiven Markttest in einer Filiale vergeben werden. Im Gegenzug kann Behrens Push-Leistungen wie Werbekostenzuschüsse oder bessere Konditionen verhandeln, um die Preiserhöhung abzufedern."],
[6,"Wählen Sie eine Wettbewerbsstrategie nach Porter und begründen Sie.","Ich empfehle die Differenzierungsstrategie bzw. Präferenzstrategie, da Behrens gegen die Kostenstruktur des Discounters keinen Preiskampf gewinnen kann. Die USP liegt in Frische, Regionalität, Bedientheken und freundlicher Beratung. Risiko sind höhere Kosten und die Gefahr, dass Kunden die Einzigartigkeit nicht wahrnehmen – sie muss deshalb konsequent kommuniziert werden."],
[6,"Wie baut Behrens ein professionelles Beschwerdemanagement auf?","Im direkten Beschwerdemanagement werden einfache, vom Unternehmen gesteuerte Kanäle geschaffen (Website, Telefon, Feedbackkarten) und Mitarbeiter in festen Standards mit Eskalationsstufen geschult. Jede Beschwerde wird dokumentiert und mit materiellen oder immateriellen Lösungen beantwortet. Im indirekten Beschwerdemanagement werden Beschwerden ausgewertet und an die Geschäftsführung berichtet – z. B. führen gehäufte Beschwerden über leere Regale zu einer geänderten Disposition mit dem Lieferanten."],
[4,"Ordnen Sie die langen Wartezeiten an der Frischetheke einer GAP zu.","Gibt es einen definierten Standard (z. B. maximale Wartezeit), den das Personal nicht einhält, liegt GAP 3 vor; Maßnahmen sind Personalplanung zu Stoßzeiten und Schulung. Fehlt ein Standard ganz, liegt eher GAP 2 vor."],
[6,"Ordnen Sie den fünften Standort in die Ansoff-Matrix ein und nennen Sie ein Bewertungsverfahren.","Mit dem bestehenden Sortiment ein neues Marktgebiet zu erschließen, ist Marktentwicklung; das Risiko ist höher, weil die Zielgruppe neu ist. Der neue Markt kann Umsätze der bestehenden Filialen kannibalisieren, daher muss das Verkaufsstellennetz betrachtet werden. Zur Bewertung eignet sich ein Scoring-Modell mit Faktoren wie Einwohnern im Einzugsgebiet, Kaufkraft, Konkurrenz, Verkehrsanbindung und Miete."],
[4,"Welche Markenstrategie empfehlen Sie für „Behrens Heimat“?","Eine Familienmarke für alle regionalen Produkte, weil Marketingkosten gebündelt werden und sich positive Erfahrungen übertragen. Risiko: Ein Problem bei einem Produkt schadet der ganzen Marke – daher sorgfältige Lieferantenauswahl, Qualitätskontrolle und Markenschutz beim DPMA."],
[6,"Wie reagiert Behrens auf die Kritik am Fleischangebot?","Behrens sollte die Innovationsstrategie wählen: früh reagieren, mit der Initiative sprechen und auf höhere Haltungsformen und regionale Erzeuger umstellen. So wird Kritik zum Profilierungsvorteil, der zur Differenzierung passt. Widerstand oder Ausweichen würden langfristig das Image schädigen, eine späte Anpassung wäre nicht mehr als eigene Innovation vermarktbar."]
]};
