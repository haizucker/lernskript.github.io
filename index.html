k5:[
{deep:"<p>Stell dir die Fallaufgabe wie einen Arztbesuch vor: Erst kommt die <b>Diagnose</b> (Analyse), dann die <b>Therapie</b> (Strategie), dann die konkreten <b>Medikamente</b> (Maßnahmen) und am Ende die <b>Nachkontrolle</b>. Viele verlieren Punkte, weil sie sofort Maßnahmen aufschreiben („mehr Werbung machen“), ohne zu zeigen, <i>warum</i>.</p><p><b>Operativ</b> heißt kurzfristig und konkret (Wochen bis Monate): Aktionen, Umräumen, Schulung. <b>Strategisch</b> heißt langfristig und grundlegend (Jahre): Standort, Eigenmarke, Positionierung. In der Klausur steht oft beides: Etwas läuft gerade schlecht (operativ lösen) <i>und</i> es muss eine langfristige Entscheidung her (strategisch begründen).</p>",merk:"„Erst Diagnose, dann Therapie“ – Analyse → Ziel → Strategie → Maßnahme → Kontrolle.",seq:["Analyse extern (Umfeld)","Analyse intern (Ressourcen)","Zusammenführen in der SWOT","Strategie wählen","Maßnahmen planen","Bewerten und kontrollieren"],pairs:[["Analyse","Wo stehen wir?"],["Strategie","Wohin und wie?"],["Maßnahme","Was tun wir konkret?"],["Kontrolle","Hat es funktioniert?"],["operativ","kurzfristig, konkret"],["strategisch","langfristig, grundlegend"]]},
{deep:"<p>PESTEL ist ein Akronym aus sechs englischen Wörtern: <b>P</b>olitical, <b>E</b>conomic, <b>S</b>ocial (soziokulturell), <b>T</b>echnological, <b>E</b>nvironmental (ökologisch) und <b>L</b>egal (rechtlich). Gemeinsam beschreiben sie die <b>Makroumwelt</b> – also das „große Ganze“, das auf alle Unternehmen wirkt und das ein einzelner Händler nicht ändern kann.</p><p>Abgrenzung: Die Five Forces betrachten die <b>Branche</b> (Mikroumwelt: Lieferanten, Kunden, Konkurrenz). PESTEL betrachtet die <b>Gesellschaft und Rahmenbedingungen</b>. Beides zusammen ergibt die Chancen und Risiken der SWOT.</p><p>Die Ressourcen sind die <b>interne</b> Seite: Was kann das Unternehmen einsetzen? Greifbare (tangible) Ressourcen kann man anfassen oder bilanzieren, nicht greifbare (intangible) wie das Image nicht – sie sind aber oft wertvoller.</p>",merk:"„Politiker Essen Selten Teure Edle Linsen“ = Politisch, Economic, Sozial, Technologisch, Environmental, Legal.",pairs:[["Politisch","Sanktionen, Förderprogramme"],["Ökonomisch","Inflation, Kaufkraft"],["Soziokulturell","Wertewandel, Demografie"],["Technologisch","Online-Handel, Scannerkassen"],["Ökologisch","Klimawandel, Ressourcenknappheit"],["Rechtlich","Gesetze, Verordnungen"]]},
{deep:"<p>SWOT steht für <b>Strengths</b> (Stärken), <b>Weaknesses</b> (Schwächen), <b>Opportunities</b> (Chancen) und <b>Threats</b> (Risiken/Bedrohungen).</p><p><b>Der Test für intern oder extern:</b> Frage dich „Kann das Unternehmen das selbst ändern?“ Ja → Stärke oder Schwäche. Nein → Chance oder Risiko. Beispiel: „Ein Discounter eröffnet nebenan“ kann der Händler nicht verhindern → Risiko. „Unser Sortiment ist veraltet“ kann er ändern → Schwäche.</p><p><b>Die SWOT-Matrix</b> (auch TOWS-Matrix genannt) kombiniert die vier Felder zu Strategien. Die wichtigste Erkenntnis aus dem Skript: Die Analyse ist kein Selbstzweck. Wer nur Listen schreibt, bekommt nur Teilpunkte – die Punkte gibt es für die abgeleiteten Strategien.</p><p><b>Typischer Fehler:</b> „Chance: Wir könnten einen Onlineshop eröffnen.“ Das ist eine Maßnahme, keine Chance. Richtig: „Chance: Kunden kaufen zunehmend online (technologischer Wandel).“</p>",merk:"S und W sind „wir“, O und T sind „die Welt da draußen“.",pairs:[["SO","Ausbauen"],["ST","Absichern"],["WO","Aufholen"],["WT","Meiden"],["Stärke / Schwäche","intern, beeinflussbar"],["Chance / Risiko","extern, nicht beeinflussbar"]]},
{deep:"<p>Das Modell stammt von <b>Michael E. Porter</b> (Harvard). „Forces“ heißt Kräfte: Fünf Kräfte bestimmen, wie hart der Wettbewerb in einer Branche ist und wie viel Gewinn dort möglich ist. Je stärker die Kräfte, desto unattraktiver die Branche.</p><p><b>Wechselkosten</b> sind ein Schlüsselbegriff: Was kostet es, den Lieferanten zu wechseln? Bei einer starken Herstellermarke sind das nicht nur Euro, sondern verlorene Kunden, die genau diese Marke suchen. Deshalb macht ein <b>Nachfragesog</b> (Pull) den Lieferanten mächtig.</p><p><b>Markteintrittsbarrieren</b> sind Hürden für neue Konkurrenten: hoher Kapitalbedarf, starke Marken der Etablierten, schwieriger Zugang zu Vertriebskanälen, Vorschriften. Niedrige Barrieren = viele neue Anbieter.</p><p>Für den Handel heißt das: Ein Supermarkt hat Lieferanten (Hersteller), Kunden (Endverbraucher), Konkurrenten (andere Händler), mögliche neue Anbieter (Lieferdienste) und Ersatz (z. B. Kochboxen, Restaurants).</p>",merk:"Stell dir ein Kreuz vor: oben neue Anbieter, unten Ersatzprodukte, links Lieferanten, rechts Kunden, in der Mitte die Rivalität.",pairs:[["Neue Anbieter","Markteintrittsbarrieren"],["Lieferanten","wenige Anbieter, hohe Wechselkosten"],["Kunden","viele Anbieter, standardisierte Produkte"],["Ersatzprodukte","gutes Preis-Leistungs-Verhältnis"],["Rivalität","Preiskriege, Werbekämpfe"]]},
{deep:"<p>Der <b>Produktlebenszyklus (PLZ)</b> funktioniert wie ein Menschenleben: Geburt (Einführung), Jugend (Wachstum), Erwachsensein (Reife), Alter (Sättigung) und Tod (Degeneration). Gemessen wird mit <b>Umsatz und Gewinn</b>.</p><p>Der <b>Break-even-Point (BEP)</b> ist die Gewinnschwelle: Ab hier deckt der Umsatz die Kosten. In der Einführung macht das Produkt Verlust (Entwicklungs- und Werbekosten), am BEP beginnt die Gewinnzone. In der Sättigung wird der BEP „von der anderen Seite“ erreicht: Das Produkt rutscht wieder in den Verlust.</p><p><b>Relaunch</b> = gezielte Wiederbelebung durch Überarbeitung (VW Bulli). <b>Revival</b> = ein Produkt kommt nach dem Verschwinden überraschend zurück. <b>Single Sourcing</b> = nur noch ein Lieferant, weil sich der Aufwand für mehrere nicht mehr lohnt.</p><p>Der <b>Marktlebenszyklus (MLZ)</b> betrachtet ganze Märkte (z. B. den Markt für DVD-Player) mit Gesamtnachfrage und Branchenrentabilität. Die Rentabilität erreicht ihr Maximum <i>vor</i> der Nachfrage, weil später Preiskämpfe die Margen drücken.</p>",merk:"„Ein Wal Reist Selten Durchs Meer“ – Einführung, Wachstum, Reife, Sättigung, Degeneration.",seq:["Einführung","Wachstum","Reife","Sättigung","Degeneration"],pairs:[["Einführung","hoher Werbedruck, endet am BEP"],["Wachstum","Nachahmer → Produktvariation"],["Reife","Produktdifferenzierung"],["Sättigung","Relaunch oder Elimination"],["Degeneration","Verträge kündigen"]]},
{deep:"<p>Die Szenariotechnik schaut nicht auf <i>eine</i> Zukunft, sondern auf mehrere mögliche. Typisch sind ein <b>Trendszenario</b> („business as usual“, alles bleibt wie es ist) und Extremszenarien (best case, worst case).</p><p><b>Wild Cards</b> sind unwahrscheinliche, aber folgenreiche Ereignisse (Pandemie, Lieferkettenkrise). <b>Desk Research</b> heißt Schreibtischrecherche: vorhandene Daten und Studien auswerten.</p>",merk:"Faktoren finden → Faktoren prüfen → Geschichte erzählen → anwenden.",seq:["Schlüsselfaktoren bestimmen","Schlüsselfaktoren analysieren","Szenarien bilden (Storylines)","Szenariotransfer"],pairs:[["Wild Card","unerwartetes Ereignis"],["Storyline","erzähltes Zukunftsbild"],["Desk Research","Schreibtischrecherche"],["business as usual","alles bleibt wie bisher"]]}
],
k6:[
{deep:"<p>Die <b>4P</b> kommen aus dem Englischen: <b>Product</b> (Produkt), <b>Price</b> (Preis), <b>Promotion</b> (Kommunikation) und <b>Place</b> (Distribution, also Vertriebsweg). Zusammen heißen sie <b>Marketing-Mix</b>.</p><p>Weil im Handel Dienstleistung entscheidend ist, kommen drei P dazu (<b>7P</b>): <b>Personnel</b> (Personal: Beratung, Freundlichkeit), <b>Process</b> (Abläufe: Click&amp;Collect, Kasse) und <b>Physical Factors</b> (Ausstattung: Ladenbau, Licht, Musik).</p><p>Das <b>4-C-Modell</b> dreht die Sicht um: statt „Was bieten wir an?“ fragt es „Was hat der Kunde davon?“ – Consumer (Kundennutzen statt Produkt), Cost (Gesamtkosten für den Kunden statt Preis), Convenience (Bequemlichkeit statt Vertriebsweg) und Communication (Dialog statt Werbung).</p>",merk:"Jedes C ist das Spiegelbild eines P: Product → Consumer, Price → Cost, Place → Convenience, Promotion → Communication.",pairs:[["Personnel","Beratungsqualität"],["Process","Click&Collect"],["Physical Factors","Ambiente, Licht, Musik"],["Consumer","Welchen Mehrwert bieten wir?"],["Cost","Zusatzkosten für den Kunden"],["Convenience","bequemer Kaufprozess"]]},
{deep:"<p>Die Matrix stammt von <b>Harry Igor Ansoff</b>. Sie beantwortet die Frage: <b>Womit</b> (altes oder neues Produkt) wachsen wir <b>wo</b> (alter oder neuer Markt)?</p><p>„Markt“ meint hier die <b>Zielgruppe bzw. das Gebiet</b>, „Produkt“ das <b>Angebot bzw. Sortiment</b>. Für einen Händler heißt das: neue Filiale in einer anderen Stadt = neuer Markt; vegane Produktlinie für die Stammkunden = neues Produkt.</p><p><b>Diversifikation</b> gibt es in drei Formen: <b>horizontal</b> (verwandtes Angebot auf derselben Stufe), <b>vertikal</b> (vor- oder nachgelagerte Stufe der Wertschöpfung: Rückwärts = Richtung Rohstoff/Lieferant, Vorwärts = Richtung Kunde) und <b>lateral</b> (völlig neue Branche).</p><p>Das Risiko steigt, weil man mit jedem „neu“ weniger Erfahrung hat: Man kennt das Produkt nicht, die Kunden nicht – oder beides nicht.</p>",merk:"Je mehr „neu“, desto mehr Risiko: 0× neu = Durchdringung, 1× neu = Markt- oder Produktentwicklung, 2× neu = Diversifikation.",pairs:[["Marktdurchdringung","altes Produkt, alter Markt"],["Marktentwicklung","altes Produkt, neuer Markt"],["Produktentwicklung","neues Produkt, alter Markt"],["Diversifikation","neues Produkt, neuer Markt"],["vertikal","Vor- oder Nachstufe"],["lateral","branchenfremd"]]},
{deep:"<p>Die BCG-Matrix wurde 1970 von <b>Bruce Henderson</b> von der Boston Consulting Group entwickelt. Sie betrachtet das ganze <b>Portfolio</b> (die Gesamtheit aller Produkte bzw. SGE) eines Unternehmens.</p><p><b>Relativer Marktanteil</b> berechnen: eigener Marktanteil ÷ Marktanteil des stärksten Konkurrenten. Beispiel: eigener MA 30 %, stärkster Konkurrent 20 % → 30 ÷ 20 = <b>1,5</b> → Marktführer. Ist man selbst nicht Marktführer, ist der Wert kleiner als 1.</p><p><b>Die Felder als Lebenslauf:</b> Ein neues Produkt startet als Question Mark (unsicher), wird bei Erfolg zum Star (wächst stark, kostet aber viel), dann zur Cash Cow (der Markt wächst kaum noch, das Produkt bringt Geld) – und endet als Poor Dog. Das Geld der Cash Cows finanziert die neuen Question Marks.</p><p><b>Grenzen:</b> nur zwei Dimensionen; Verbundeffekte und Qualität werden nicht berücksichtigt; bei Question Marks bleibt die Entscheidung offen.</p>",merk:"Fragezeichen → Stern → Kuh → Hund: der Lebenslauf eines Produkts.",seq:["Matrix mit den beiden Achsen zeichnen","Trennlinie rel. Marktanteil bei 1","Trennlinie Marktwachstum = Durchschnitt","SGE als Kreise eintragen (Größe = Umsatz)","Normstrategien ableiten"],pairs:[["Question Mark","investieren oder abstoßen"],["Star","investieren"],["Cash Cow","abschöpfen"],["Poor Dog","loswerden"],["rel. Marktanteil","Trennlinie bei 1"],["Kreisgröße","Umsatz"]]},
{deep:"<p>Porter sagt: Ein Unternehmen braucht einen klaren <b>Wettbewerbsvorteil</b> – entweder ist es <b>günstiger</b> (Kostenvorteil) oder <b>besser/anders</b> (Leistungsvorteil). Zusätzlich entscheidet es, ob es den <b>ganzen Markt</b> bedient oder nur eine <b>Nische</b> (Fokus).</p><p>Die <b>USP</b> (Unique Selling Proposition) ist das Alleinstellungsmerkmal – der Grund, warum Kunden genau hier kaufen und nicht woanders. Ohne USP keine Differenzierung.</p><p><b>Stuck in the middle</b> („in der Mitte stecken geblieben“): Ein Supermarkt, der etwas teurer ist als Aldi, aber nicht besser als der Feinkosthändler, hat für keinen Kunden einen echten Grund. Genau das ist häufig die Ausgangslage im Klausurfall.</p><p>Die <b>Präferenzstrategie</b> entspricht der Differenzierung (der Kunde zieht das Angebot vor – unabhängig vom Preis), die <b>Preis-Mengen-Strategie</b> der Kostenführerschaft (viel Menge über niedrige Preise).</p>",merk:"Billiger, besser oder spezieller – aber nie alles halb.",pairs:[["Kostenführerschaft","niedrigste Kosten, Skaleneffekte"],["Differenzierung","einzigartig, braucht USP"],["Fokus","Nische, ein Segment"],["Stuck in the middle","kein Wettbewerbsvorteil"],["Präferenzstrategie","Kauf wegen Leistung"],["Preis-Mengen-Strategie","Preis entscheidet"]]},
{deep:"<p><b>Push</b> (englisch „drücken“): Der Hersteller drückt die Ware in den Handel – mit Rabatten, <b>WKZ</b> (Werbekostenzuschüssen), Regalmieten, Unterstützung beim Ladenbau. Der Händler listet, weil es sich für ihn lohnt.</p><p><b>Pull</b> (englisch „ziehen“): Der Hersteller wirbt beim Endkunden (TV, Social Media). Die Kunden fragen das Produkt im Laden nach – es entsteht ein <b>Nachfragesog</b>, der das Produkt in den Handel „zieht“. Der Händler muss listen, sonst gehen die Kunden woanders hin.</p><p><b>Machtverschiebung:</b> Früher hatten große Markenhersteller die Macht. Heute haben große Händler eigene <b>Handelsmarken</b> (im LEH 40,2 % Marktanteil 2022, bei TK sogar 50,9 %) und Scannerdaten, also Wissen darüber, was Kunden wirklich kaufen. Damit können sie Herstellermarken auslisten.</p>",merk:"Push = Druck auf den Händler. Pull = Zug über den Kunden.",pairs:[["Push","Maßnahmen an den Handel"],["Pull","Maßnahmen an den Endkunden"],["WKZ","Werbekostenzuschuss"],["Nachfragesog","Kunden verlangen das Produkt"],["Handelsmarke","Eigenmarke des Händlers"],["Scannerdaten","Informationsvorsprung des Handels"]]},
{deep:"<p>Die Verhaltensstrategien beschreiben, wie sich ein Unternehmen gegenüber anderen verhält – <b>horizontal</b> (gegenüber Konkurrenten auf derselben Stufe) und <b>vertikal</b> (zwischen Hersteller und Händler).</p><p><b>Innovativ</b> heißt: eigene, neue Wege gehen. <b>Imitativ</b> heißt: sich an anderen orientieren. <b>Wettbewerbsvermeidend</b> heißt: dem Kampf aus dem Weg gehen. <b>Wettbewerbsstellend</b> heißt: sich dem Wettbewerb aktiv stellen.</p><p><b>ECR</b> (Efficient Consumer Response) ist die Kooperation par excellence: Hersteller und Händler planen Sortiment, Nachschub, Neueinführungen und Aktionen gemeinsam, um die Kunden effizienter zu bedienen.</p><p><b>Multi-Channel</b>: mehrere Kanäle nebeneinander, abgestimmt. <b>Omni-Channel</b>: alle Kanäle verschmolzen – der Kunde bestellt online, holt im Laden ab, reklamiert per App, und jeder Kanal kennt ihn.</p>",merk:"Ausweichen und Anpassen vermeiden den Kampf, Konflikt und Kooperation stellen sich ihm.",pairs:[["Ausweichen","eigene Vertriebswege des Herstellers"],["Anpassung","kein USP, Handel bestimmt"],["Konflikt","Kampf um Marktanteile"],["Kooperation","Partnerschaft über ECR"],["Multi-Channel","Kanäle abgestimmt"],["Omni-Channel","Kanäle vollständig integriert"]]},
{deep:"<p><b>Stakeholder</b> (Anspruchsgruppen) sind alle, die Interessen am Unternehmen haben: Kunden, Mitarbeiter, Lieferanten, Medien, Bürgerinitiativen, NGOs (Nichtregierungsorganisationen wie Tierschutzverbände), Staat.</p><p>Die fünf Strategien reichen von <b>proaktiv</b> (Innovation: handeln, bevor es nötig ist) bis <b>passiv</b> (Passivität: ignorieren). Je früher ein Unternehmen reagiert, desto eher kann es die Reaktion als eigene Leistung vermarkten.</p><p><b>Lobbyismus</b> (bei der Widerstandsstrategie) bedeutet, Politiker und Gesetzgebung im eigenen Interesse zu beeinflussen.</p>",merk:"Innovation → Anpassung → Widerstand → Ausweichen → Passivität: von „vorne dabei“ bis „Augen zu“.",pairs:[["Innovation","früh reagieren, kooperieren"],["Anpassung","abwarten, bis es nicht anders geht"],["Widerstand","Lobbyismus, Status quo"],["Ausweichen","Problem ins Ausland verlagern"],["Passivität","Anspruchsgruppen ignorieren"]]},
{deep:"<p><b>Timing</b>: First Mover (Pionier) sind die Ersten im Markt, Late Mover (Folger) kommen später. <b>Wasserfall</b> heißt: Markt für Markt nacheinander, wie Wasser von Stufe zu Stufe. <b>Sprinkler</b> heißt: viele Märkte gleichzeitig, wie ein Rasensprenger.</p><p><b>Internationalisierung</b>: Beim <b>Export</b> wird die Ware ins Ausland verkauft (direkt oder über Zwischenhändler). Bei der <b>Lizenz</b> darf ein ausländisches Unternehmen Marke oder Know-how gegen Gebühr nutzen. Ein <b>Joint Venture</b> ist ein gemeinsames Unternehmen mit einem lokalen Partner. Bei der <b>Direktinvestition</b> baut man selbst neu auf (<b>Greenfield</b>, „auf der grünen Wiese“) oder kauft ein Unternehmen (<b>Akquisition</b>).</p><p><b>Ethnozentrisch</b> = Heimatmarkt-Denken, <b>polyzentrisch</b> = jedes Land einzeln angepasst, <b>geozentrisch</b> = weltweit einheitlich gedacht.</p>",merk:"Export → Lizenz → Joint Venture → Direktinvestition: mit jeder Stufe mehr Geld, mehr Risiko, mehr Kontrolle.",seq:["Export","Lizenzierung","Joint Venture","Direktinvestition"],pairs:[["First Mover","Pionier, hohes Risiko"],["Late Mover","lernt aus Fehlern anderer"],["Wasserfall","schrittweise, Testmarkt"],["Sprinkler","alle Märkte gleichzeitig"],["Joint Venture","gemeinsames Unternehmen mit Partner"],["Greenfield","Neuaufbau im Ausland"]]}
],
k8:[
{deep:"<p><b>Visual Merchandising</b> setzt sich zusammen aus „visual“ (sichtbar) und „Merchandising“ (Verkaufsförderung). Es geht darum, Ware und Laden so zu inszenieren, dass Kunden sich wohlfühlen, länger bleiben und mehr kaufen.</p><p><b>Quantitative Raumzuteilung</b> beantwortet „Wie viel Fläche bekommt eine Warengruppe?“ – nach Deckungsbeitrag, Handelsspanne, Kaufhäufigkeit. <b>Qualitative Raumzuteilung</b> beantwortet „Welche Fläche bekommt sie?“ – gute oder schlechte Zone.</p><p>Warum <b>rechts</b>? Die meisten Kunden gehen gegen den Uhrzeigersinn und schauen eher nach rechts. Die <b>Eingangszone</b> ist schlecht, weil Kunden dort erst „ankommen“ und noch nicht kaufbereit sind.</p>",merk:"Rechts, Hauptweg, Kreuzung, Kasse = gut. Links, Eingang, Sackgasse = schlecht.",pairs:[["rechts vom Kundenstrom","hochwertige Zone"],["Sackgasse","minderwertige Zone"],["Verbundplatzierung","Grillen-Szenario"],["Zweitplatzierung","zusätzlich zum Stammplatz"],["Wühltisch am Eingang","Preiswürdigkeit"],["Griffhöhe","gut kalkulierte Produkte"]]},
{deep:"<p><b>Category Management (CM)</b> heißt Warengruppen-Management: Statt jedes Produkt einzeln zu betrachten, führt der Händler eine ganze Kategorie (z. B. „Frühstück“ oder „Babypflege“) wie ein eigenes kleines Unternehmen mit Zielen, Strategie und Erfolgskontrolle.</p><p>Die Kategorien orientieren sich am <b>Kunden</b>, nicht am Lieferanten: „Frühstück“ umfasst Müsli, Marmelade und Kaffee – auch wenn diese von verschiedenen Herstellern kommen.</p><p><b>ECR</b> (Efficient Consumer Response) ist das Gesamtkonzept der Zusammenarbeit von Hersteller und Händler. CM ist sein Kern. Die vier Säulen: <b>Assortment</b> (Sortiment), <b>Replenishment</b> (Nachschub), <b>Product Introduction</b> (Neueinführung) und <b>Promotion</b> (Verkaufsförderung).</p><p><b>EAN</b> ist die Europäische Artikelnummer (der Strichcode) – ohne sie keine Scannerdaten und damit kein automatischer Nachschub. <b>Just-in-Time</b> heißt Lieferung genau dann, wenn die Ware gebraucht wird.</p>",merk:"ECR-Säulen „A-R-P-P“: Assortment, Replenishment, Product Introduction, Promotion.",seq:["Sortiment analysieren","Kundenpotenzial analysieren","Ziele und Strategie festlegen","Strategie testen","Bewerten","Umsetzen","Kontrollieren"],pairs:[["Efficient Assortment","optimales Sortiment"],["Efficient Replenishment","effizienter Nachschub"],["Efficient Product Introduction","Neueinführungen gemeinsam"],["Efficient Promotion","Aktionen gemeinsam"],["EAN","Strichcode, Artikelnummer"],["Kategorie","Warengruppe als Geschäftseinheit"]]},
{deep:"<p><b>Variation</b> = Austausch (alte Version raus, neue rein). <b>Differenzierung</b> = Ergänzung (neue Variante zusätzlich). <b>Elimination</b> = Streichung.</p><p><b>Die drei Effekte der Sortimentsvertiefung</b> (mehr Sorten in einer Warengruppe): Beim <b>Substitutionseffekt</b> kaufen Kunden statt der alten die neue Sorte – nichts gewonnen, nur verschoben. Beim <b>Partizipationseffekt</b> kommen Kunden von der Konkurrenz – echtes Wachstum. Beim <b>Bedarfserweiterungseffekt</b> kaufen Kunden zusätzlich (zwei Sorten statt einer).</p><p><b>Neuheitsgrade</b>: echte Innovation (Weltneuheit, selten), Marktneuheit (für Kunden neu erlebbar), quasi-neu (Verbesserung) und <b>Me-too</b> (Nachahmung – im Handel am häufigsten, auch viele Handelsmarken).</p>",merk:"Variation tauscht, Differenzierung ergänzt, Elimination streicht.",pairs:[["Variation","Anzahl bleibt gleich"],["Differenzierung","Anzahl steigt"],["Substitutionseffekt","eigene Produkte verdrängt"],["Partizipationseffekt","Kunden von der Konkurrenz"],["Bedarfserweiterung","Kunden kaufen mehrere Sorten"],["Me-too","Nachahmung"]]},
{deep:"<p>Die Nutzwertanalyse macht Bauchentscheidungen <b>nachvollziehbar</b>: Jede Alternative bekommt pro Kriterium eine Note, die Noten werden nach Wichtigkeit gewichtet und addiert.</p><p><b>Rechenbeispiel:</b> Kriterium Marktpotenzial, Gewicht 0,2, Note 5 → 0,2 × 5 = 1,0 Teilnutzen. Alle Teilnutzen addiert ergeben den Gesamtnutzwert.</p><p>Wichtig: Die Gewichte müssen zusammen <b>1 bzw. 100 %</b> ergeben. Die Schwäche: Gewichte und Noten bleiben subjektiv – deshalb sollten sie gut begründet sein.</p>",merk:"Kriterien → Gewicht → Note → multiplizieren → addieren.",seq:["Kriterien festlegen","Kriterien gewichten (Summe 1)","Alternativen benoten","Note × Gewicht","Summieren und vergleichen"],pairs:[["Gewichtung","Summe = 1"],["Teilnutzen","Note × Gewicht"],["Nutzwert","Summe der Teilnutzen"],["Scoring-Modell","anderer Name, z. B. für Standorte"]]},
{deep:"<p>Eine <b>Marktlücke</b> (Nische) ist Nachfrage, die bisher niemand richtig bedient. Die Positionierungsanalyse macht sie sichtbar: Man zeichnet ein Koordinatensystem aus zwei Eigenschaften, die Kunden wichtig sind, und trägt alle Konkurrenten ein.</p><p>Ein leeres Feld ist aber nur eine <i>mögliche</i> Chance. Es kann auch leer sein, weil es dort keine Kunden gibt. Deshalb sagt das Skript: „Man kann sich seine Kunden nicht backen.“</p>",merk:"Zwei Achsen, Konkurrenten einzeichnen, leeres Feld prüfen.",seq:["Gegensatzpaare festlegen","Bewertungsskala festlegen","Paare als Achsen anordnen","Konkurrenten einzeichnen","Leeres Feld auf Zielgruppe prüfen"],pairs:[["Marktlücke","ungedeckte Nachfrage"],["Kreisgröße","Umsatz des Konkurrenten"],["Achse","Gegensatzpaar"],["leeres Feld","mögliche Nische"]]},
{deep:"<p>Das <b>KANO-Modell</b> stammt von Noriaki Kano (Universität Tokio). Es zeigt: Nicht jedes Merkmal wirkt gleich auf die Zufriedenheit.</p><p><b>Basismerkmale</b> merkt man nur, wenn sie fehlen (ein leeres Regal ärgert, ein volles begeistert niemanden). <b>Leistungsmerkmale</b> wirken linear: mehr davon = zufriedener (bessere Beratung). <b>Begeisterungsmerkmale</b> erwartet niemand – wenn sie da sind, begeistern sie überproportional.</p><p><b>Pre-Sales</b> = Service vor dem Kauf (Beratung), <b>At-Sales</b> = beim Kauf (Einpacken), <b>After-Sales</b> = nach dem Kauf (Reparatur, Umtausch).</p>",merk:"Basis = „muss“, Leistung = „je mehr, desto besser“, Begeisterung = „wow“.",pairs:[["Basismerkmal","selbstverständlich erwartet"],["Leistungsmerkmal","mehr = zufriedener"],["Begeisterungsmerkmal","unerwartet, Wow-Effekt"],["Pre-Sales","Service vor dem Kauf"],["After-Sales","Service nach dem Kauf"],["Discounter","kaum Service"]]},
{deep:"<p>Beschwerden sind ein <b>Geschenk</b>: Die meisten unzufriedenen Kunden beschweren sich nicht, sondern kommen einfach nicht wieder. Wer sich beschwert, gibt dem Händler eine zweite Chance.</p><p><b>Direkt</b> = alles, was mit dem Kunden passiert (Phasen 1–4). <b>Indirekt</b> = alles, was intern passiert (Phase 5: Auswertung, Reporting an die Chefs, Controlling). Ohne den indirekten Teil wiederholen sich dieselben Fehler.</p><p><b>CRM</b> (Customer Relationship Management) ist die systematische Kundenpflege – das Beschwerdemanagement ist ein Teil davon. <b>Eskalationsstufen</b> legen fest, wann eine Beschwerde an die nächsthöhere Stelle geht.</p>",merk:"„Sie Achten Bei Reklamationen Aufs“: Stimulierung, Annahme, Bearbeitung, Reaktion, Auswertung.",seq:["Beschwerdestimulierung","Beschwerdeannahme","Beschwerdebearbeitung","Beschwerdereaktion","Beschwerdeauswertung"],pairs:[["Stimulierung","einfache, bekannte Kanäle"],["Annahme","vollständig dokumentieren"],["Bearbeitung","Standards, Eskalationsstufen"],["Reaktion","Lösung für den Kunden"],["Auswertung","Veränderung im Unternehmen"],["indirektes BM","Reporting und Controlling"]]},
{deep:"<p><b>GAP</b> heißt auf Englisch „Lücke“. Man vergleicht, wo man hinwollte (Soll), mit dem, wo man landet, wenn man weitermacht wie bisher (Ist).</p><p><b>Die vier Service-GAPs</b> kann man sich als Kette vorstellen: Das Management muss erst wissen, was Kunden wollen (GAP 1), dann die richtigen Standards festlegen (GAP 2), dann muss das Personal sie umsetzen (GAP 3), und schließlich muss die Werbung halten, was der Laden liefert (GAP 4). Reißt ein Glied, entsteht eine Lücke.</p>",merk:"Wissen → Planen → Umsetzen → Versprechen: GAP 1, 2, 3, 4.",seq:["GAP 1: Kundenwunsch nicht erkannt","GAP 2: falsche Maßnahmen","GAP 3: Personal setzt nicht um","GAP 4: Versprechen nicht gehalten"],pairs:[["GAP 1","Management kennt Kundenwunsch nicht"],["GAP 2","falsche Maßnahmen"],["GAP 3","Personal setzt Standards nicht um"],["GAP 4","Versprechen nicht gehalten"],["operative Lücke","kurzfristig schließen"],["strategische Lücke","langfristig schließen"]]},
{deep:"<p>Eine Marke ist heute mehr als ein Logo: Sie ist das <b>Bild im Kopf</b> des Kunden. „Der Konsument macht die Marke“ – er entscheidet, ob er sie liebt oder ablehnt. Den Aufbau einer Marke nennt man <b>Branding</b>.</p><p><b>DPMA</b> = Deutsches Patent- und Markenamt. Dort lässt man eine Marke für bestimmte Waren-/Dienstleistungsklassen schützen. Ein <b>Patent</b> schützt technische Erfindungen (20 Jahre, geprüft), ein <b>Gebrauchsmuster</b> ist das „kleine Patent“ (10 Jahre, ungeprüft), ein <b>Design</b> schützt die Optik (25 Jahre).</p><p><b>Vertikaler Wettbewerb</b>: Handelsmarke gegen Herstellermarke (unterschiedliche Stufen der Wertschöpfung). <b>Horizontaler Wettbewerb</b>: Herstellermarke gegen Herstellermarke (gleiche Stufe).</p>",merk:"Einzel = jedes eigen, Familie = Gruppe gemeinsam, Dach = alles unter dem Firmennamen, Mehr = mehrere in einer Kategorie.",pairs:[["Einzelmarke","Ariel, Pampers"],["Familienmarke","Nivea"],["Dachmarke","Siemens"],["Mehrmarkenstrategie","VW, Audi, Skoda"],["Patent","20 Jahre"],["Design","25 Jahre"]]},
{deep:"<p>Ein Standort ist wie eine Ehe: schwer und teuer wieder aufzulösen. Deshalb wird er systematisch geprüft.</p><p>Das <b>Einzugsgebiet</b> ist das Gebiet, aus dem die Kunden kommen. Die <b>Zeitdistanzmethode</b> misst es in Minuten statt Kilometern, weil Kunden in Zeit denken. <b>Gravitationsmodelle</b> funktionieren wie die Schwerkraft: Große, attraktive Standorte ziehen Kunden aus größerer Entfernung an.</p><p><b>Kannibalisierung</b>: Eröffnet ein Händler eine neue Filiale nahe einer bestehenden, „frisst“ die neue der alten Umsatz weg. Deshalb plant man ein <b>Verkaufsstellennetz</b>.</p><p><b>Standorttypen</b>: Typ 1 Wohnnähe (Bäcker, Supermarkt), Typ 2 Konkurrenznähe (Vergleichskauf, z. B. Möbel, Elektronik), Typ 3 Nähe zu ergänzenden Sortimenten (Mode und Schuhe), Typ 4 Passantenströme (Kiosk, Impulskauf), Typ 5 verkehrsgünstig (Baumarkt, Möbelhaus). <b>BID</b> = Business Improvement District.</p>",merk:"80–15–5: so viel Prozent der Kunden kommen aus 5, 8 und 10 Gehminuten.",seq:["Einzugsgebiet abgrenzen","Standortfaktoren analysieren","Abgestuft bewerten","Mit Scoring-Modell entscheiden"],pairs:[["Typ 1","Nähe zu Wohnorten"],["Typ 2","Nähe zur Konkurrenz"],["Typ 4","Passantenströme, Impulskauf"],["Typ 5","verkehrsgünstig, viel Fläche"],["80 %","bis 5 Gehminuten"],["BID","Standortgemeinschaft, alle zahlen"]]}

panels.push({id:"start",tab:"Start",html:'<h2>Dein Lernfortschritt</h2><div id="hm-dashbox"></div><h2>So nutzt du das Lernskript</h2><div class="hm-intro">Jedes Kapitel enthält alle Modelle als aufklappbare Karten: <b>Grafik</b>, <b>Kurz erklärt</b>, <b>Ausführlich erklärt</b> (mit Eselsbrücke), <b>Ablauf</b>, <b>Klausur-Tipp</b>, <b>Spielmodus</b> und eine <b>Beispielaufgabe mit Lösung</b>. Gepunktet unterstrichene Abkürzungen wie '+ab("SWOT")+' oder '+ab("ECR")+' kannst du antippen – dann erscheint ihre Bedeutung. Unten rechts öffnest du jederzeit den <b>Karteikasten</b>.</div><h3>Lernplan für einen Tag</h3><ol><li><b>Kapitel 5 durcharbeiten:</b> Karten lesen, „Ausführlich erklärt“ öffnen, je Modell ein Memory spielen, Quiz machen.</li><li><b>Kapitel 6 und 8.1</b> genauso. Nach jedem Kapitel eine Pause.</li><li><b>Karteikasten:</b> so lange wiederholen, bis die meisten Karten in Fach 3 oder höher liegen.</li><li><b>Übungsfall</b> selbst lösen, dann mit der Musterlösung vergleichen.</li><li><b>Abschlussquiz</b> – Ziel: über 90 % im Gesamtfortschritt.</li></ol><h3>Der rote Faden für jede Fallaufgabe</h3>'+G.fall+'<p><b>Punkte-Faustregel:</b> ca. 2 Punkte pro Satz. Jeder Satz = <b>Fachbegriff + Fallbezug + Begründung</b>. Kurzfristige (operative) und langfristige (strategische) Maßnahmen immer trennen.</p><h3>Fall-Signal → passendes Instrument</h3>'+ab(table(["Wenn im Fall steht …","… dann denke an"],SIGNALS))+'<div class="hm-kl"><span class="hm-lab">Notfall-Kette</span><p style="margin:0">Wenn dir nichts einfällt: <b>SWOT → Five Forces → Strategie (Ansoff oder Porter) → konkrete Maßnahme → Bewertung mit Nutzwertanalyse</b>. Das passt auf fast jeden Fall.</p></div>'});

var game=null;
function findModel(chId,i){var ch=CH.filter(function(c){return c.id===chId;})[0];return ch?ch.models[i]:null;}
function startMemory(chId,i){var m=findModel(chId,i);if(!m)return;var gid=chId+"-"+i+"-mem",cards=[];
m.pairs.forEach(function(p,k){cards.push({k:k,t:p[0],c:"a"});cards.push({k:k,t:p[1],c:"b"});});cards=shuffle(cards);
game={type:"mem",gid:gid,cards:cards,open:[],found:0,moves:0,lock:false,chId:chId,i:i};
var h='<h3>Memory: '+m.t+'</h3><p class="hm-small">Finde die Paare: <b style="color:#b25a12">Begriff</b> (orange) und <b style="color:#1F5C8B">Erklärung</b> (blau) gehören zusammen.</p><div class="hm-gstat"><span>Züge: <b class="mv">0</b></span><span>Paare: <b class="fd">0</b>/'+m.pairs.length+'</span></div><div class="hm-mem" style="--c:'+(cards.length===10?5:4)+';--cm:'+(cards.length%3===0?3:2)+'">';
cards.forEach(function(c,j){h+='<button data-j="'+j+'" aria-label="Verdeckte Karte">'+esc(c.t)+'</button>';});
h+='</div><div class="hm-wbox"></div><button class="hm-btn hm-again" data-ch="'+chId+'" data-i="'+i+'" data-kind="mem">Neu mischen</button>';openModal(h);}
function memClick(btn){var g=game;if(!g||g.lock)return;var j=+btn.getAttribute("data-j"),c=g.cards[j];if(btn.classList.contains("up")||btn.classList.contains("match"))return;
btn.classList.add("up",c.c);btn.setAttribute("aria-label",c.t);g.open.push(j);
if(g.open.length===2){g.moves++;var a=g.cards[g.open[0]],b=g.cards[g.open[1]],btns=modal.querySelectorAll(".hm-mem button"),A=btns[g.open[0]],B=btns[g.open[1]];
if(a.k===b.k&&a.c!==b.c){A.classList.add("match");B.classList.add("match");A.disabled=B.disabled=true;g.found++;g.open=[];}
else{g.lock=true;A.classList.add("bad");B.classList.add("bad");setTimeout(function(){[A,B].forEach(function(x){x.classList.remove("up","a","b","bad");x.setAttribute("aria-label","Verdeckte Karte");});g.open=[];g.lock=false;},900);}
modal.querySelector(".mv").textContent=g.moves;modal.querySelector(".fd").textContent=g.found;
if(g.found===g.cards.length/2){S.g[g.gid]=true;save();var best=g.cards.length/2;modal.querySelector(".hm-wbox").innerHTML='<div class="hm-win">Geschafft in '+g.moves+' Zügen'+(g.moves<=best+2?' – fast perfekt!':'')+' Das Spiel zählt jetzt zu deinem Fortschritt.</div>';}}}
function startSeq(chId,i){var m=findModel(chId,i);if(!m)return;var gid=chId+"-"+i+"-seq";game={type:"seq",gid:gid,seq:m.seq,next:0,err:0,chId:chId,i:i};
var order=shuffle(m.seq.map(function(s,k){return k;}));
var h='<h3>Reihenfolge: '+m.t+'</h3><p class="hm-small">Tippe die Schritte in der richtigen Reihenfolge an.</p><div class="hm-gstat"><span>Fehler: <b class="er">0</b></span><span>Geschafft: <b class="nx">0</b>/'+m.seq.length+'</span></div><div class="hm-ord-done"></div><div class="hm-ord-pool">';
order.forEach(function(k){h+='<button data-k="'+k+'">'+esc(m.seq[k])+'</button>';});h+='</div><div class="hm-wbox"></div><button class="hm-btn hm-again" data-ch="'+chId+'" data-i="'+i+'" data-kind="seq">Neu mischen</button>';openModal(h);}
function seqClick(btn){var g=game;if(!g)return;var k=+btn.getAttribute("data-k");
if(k===g.next){var d=document.createElement("div");d.innerHTML='<span>'+(k+1)+'</span>'+esc(g.seq[k]);modal.querySelector(".hm-ord-done").appendChild(d);btn.remove();g.next++;modal.querySelector(".nx").textContent=g.next;
if(g.next===g.seq.length){S.g[g.gid]=true;save();modal.querySelector(".hm-wbox").innerHTML='<div class="hm-win">'+(g.err===0?'Perfekt – ohne Fehler!':'Geschafft mit '+g.err+' Fehler'+(g.err>1?'n':'')+'.')+' Das Spiel zählt jetzt zu deinem Fortschritt.</div>';}}
else{g.err++;modal.querySelector(".er").textContent=g.err;btn.classList.remove("bad");void btn.offsetWidth;btn.classList.add("bad");}}
/* ---------- Karteikasten (Leitner) ---------- */
var fc={deck:"alle",cur:null,last:null};
function deckCards(){var out=[];DECKS.forEach(function(d){if(fc.deck!=="alle"&&fc.deck!==d[0])return;(CARDS[d[0]]||[]).forEach(function(c,i){out.push({id:d[0]+"-"+i,f:c[0],b:c[1],d:d[1]});});});return out;}
function box(id){return S.f[id]||1;}
function pickCard(){var cs=deckCards();if(!cs.length)return null;var min=6;cs.forEach(function(c){min=Math.min(min,box(c.id));});
var cand=cs.filter(function(c){return box(c.id)===min&&c.id!==fc.last;});if(!cand.length)cand=cs.filter(function(c){return c.id!==fc.last;});if(!cand.length)cand=cs;return cand[Math.floor(Math.random()*cand.length)];}
function fcHtml(){var cs=deckCards(),cnt=[0,0,0,0,0];cs.forEach(function(c){cnt[box(c.id)-1]++;});var c=fc.cur;
var h='<h3>Karteikasten</h3><p class="hm-small">Lernkartei nach dem <b>Leitner-System</b>: Jede Karte startet in Fach 1. Gewusst → ein Fach weiter, nicht gewusst → zurück in Fach 1. Gezeigt werden immer zuerst die Karten aus dem niedrigsten Fach. Ab Fach 3 gilt eine Karte als sicher.</p><div class="hm-chips">';
[["alle","Alle"]].concat(DECKS).forEach(function(d){h+='<button class="hm-deck'+(fc.deck===d[0]?' on':'')+'" data-d="'+d[0]+'">'+d[1]+'</button>';});
h+='</div><div class="hm-boxes">';for(var i=0;i<5;i++)h+='<div class="'+(c&&box(c.id)===i+1?'cur':'')+'"><b>'+cnt[i]+'</b>Fach '+(i+1)+'</div>';h+='</div>';
if(c){h+='<div class="hm-fc" tabindex="0" aria-label="Karte umdrehen"><div class="hm-fcin"><div class="hm-fside hm-front"><div class="meta">'+c.d+' · Fach '+box(c.id)+'</div><div class="q">'+esc(c.f)+'</div><div class="hm-small" style="margin-top:10px">Antippen zum Umdrehen</div></div><div class="hm-fside hm-back"><div class="meta">Antwort</div><div>'+ab(esc(c.b))+'</div></div></div></div><div class="hm-fcbtns"><button class="hm-flip">Umdrehen</button><button class="no hm-fno">Nicht gewusst</button><button class="ok hm-fok">Gewusst</button></div>';}
h+='<p class="hm-small">'+(cnt[2]+cnt[3]+cnt[4])+' von '+cs.length+' Karten sicher (Fach 3–5). <button class="hm-freset">Diesen Stapel zurücksetzen</button></p>';return h;}
function openCards(){fc.cur=pickCard();openModal(fcHtml());}

/* ---------- Events ---------- */
root.addEventListener("click",function(ev){var t=ev.target,b;
